<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <!-- Load HEAD fragment (CSS, meta, title) -->
    <th:block th:replace="~{fragments/header :: header('My Profile')}"></th:block>

    <style>
        body {
            margin: 0;
        }

        .wrapper {
            margin-top: 60px;
        }

        .main-content {
            margin-left: 250px;
            padding: 30px;
        }
    </style>
</head>

<body>

<!-- Load TOPBAR inside body -->
<div th:replace="~{fragments/header :: topbar('My Profile')}"></div>

<div class="wrapper">

    <!-- Sidebar -->
    <div th:replace="~{fragments/employee-sidebar :: sidebar}"></div>

    <!-- Main Content -->
    <div class="main-content">

        <h3 class="fw-bold mb-4">My Profile</h3>

        <div class="row">
            <div class="col-md-8">
                <div class="card shadow-sm border-0">
                    <div class="card-header bg-dark text-white">
                        Employee Information
                    </div>

                    <div class="card-body">
                        <table class="table table-bordered">
                            <tr>
                                <th>Employee ID</th>
                                <td th:text="${employee.employeeId}"></td>
                            </tr>
                            <tr>
                                <th>Full Name</th>
                                <td th:text="${employee.firstName + ' ' + employee.lastName}"></td>
                            </tr>
                            <tr>
                                <th>Email</th>
                                <td th:text="${employee.email}"></td>
                            </tr>
                            <tr>
                                <th>Phone</th>
                                <td th:text="${employee.phoneNumber}"></td>
                            </tr>
                            <tr>
                                <th>Department</th>
                                <td th:text="${employee.department != null ? employee.department.name : 'N/A'}"></td>
                            </tr>
                            <tr>
                                <th>Designation</th>
                                <td th:text="${employee.designation != null ? employee.designation.title : 'N/A'}"></td>
                            </tr>
                            <tr>
                                <th>Joining Date</th>
                                <td th:text="${employee.joiningDate}"></td>
                            </tr>
                            <tr>
                                <th>Status</th>
                                <td>
                                    <span class="badge bg-success"
                                          th:text="${employee.status}"></span>
                                </td>
                            </tr>
                        </table>
                    </div>

                </div>
            </div>
        </div>

    </div>
</div>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
