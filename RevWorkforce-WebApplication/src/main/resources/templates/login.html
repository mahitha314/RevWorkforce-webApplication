<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>RevWorkForce | Secure Login</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', sans-serif;
        }

        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #1f4037, #99f2c8);
        }

        .login-container {
            background: #ffffff;
            padding: 40px;
            width: 380px;
            border-radius: 12px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.2);
        }

        .company-name {
            text-align: center;
            font-size: 24px;
            font-weight: 600;
            color: #1f4037;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            font-size: 14px;
            color: gray;
            margin-bottom: 30px;
        }

        .input-group {
            margin-bottom: 18px;
        }

        .input-group label {
            font-size: 13px;
            color: #444;
        }

        .input-group input {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            border-radius: 6px;
            border: 1px solid #ccc;
            outline: none;
            transition: 0.3s;
        }

        .input-group input:focus {
            border-color: #1f4037;
            box-shadow: 0 0 5px rgba(31,64,55,0.3);
        }

        .login-btn {
            width: 100%;
            padding: 12px;
            background-color: #1f4037;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 500;
            transition: 0.3s;
        }

        .login-btn:hover {
            background-color: #16312a;
        }

        .footer-text {
            text-align: center;
            font-size: 12px;
            margin-top: 20px;
            color: gray;
        }

        .error-msg {
            color: red;
            font-size: 13px;
            margin-top: 10px;
            text-align: center;
        }
    </style>
</head>

<body>

<div class="login-container">

    <div class="company-name">RevWorkForce</div>
    <div class="subtitle">Enterprise HR Management System</div>

    <form th:action="@{/login}" method="post">

	    <div class="input-group">
	        <label>Email Address</label>
	        <input type="text" name="username" placeholder="Enter your corporate email" required>
	    </div>

	    <div class="input-group">
	        <label>Password</label>
	        <input type="password" name="password" placeholder="Enter your password" required>
	    </div>

	    <button type="submit" class="login-btn">Sign In</button>

	    <div th:if="${param.error}" class="error-msg">
	        Invalid email or password
	    </div>

	</form>

    <div class="footer-text">
        © 2026 RevWorkForce. All Rights Reserved.
    </div>

</div>

</body>
</html>
