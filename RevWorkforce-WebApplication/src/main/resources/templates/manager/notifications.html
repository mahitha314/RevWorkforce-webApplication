<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="fragments/header :: header('Manager Notifications')"></head>

<body>

	<!-- Sidebar -->
	    <div th:replace="~{fragments/manager-sidebar :: managerSidebar}"></div>

<!-- Topbar -->
<div th:replace="~{fragments/header :: topbar('Manager Notifications')}"></div>

<!-- MAIN CONTENT -->
<div class="content">

    <div class="container-fluid">

        <h3 class="fw-bold mb-4">🔔 Manager Notifications</h3>

        <div class="card shadow-sm border-0 p-4">

            <!-- No Notifications -->
            <div th:if="${notifications == null or #lists.isEmpty(notifications)}"
                 class="alert alert-info">
                You currently have no notifications.
            </div>

            <!-- Notifications Table -->
            <table th:if="${notifications != null and !#lists.isEmpty(notifications)}"
                   class="table table-hover table-bordered align-middle">

                <thead class="table-dark text-center">
                <tr>
                    <th>Title</th>
                    <th>Message</th>
                    <th width="200">Date</th>
                    <th width="120">Status</th>
                </tr>
                </thead>

                <tbody>

                <tr th:each="n : ${notifications}"
                    th:classappend="${!n.isRead} ? 'table-warning'">

                    <td th:text="${n.title}"></td>

                    <td th:text="${n.message}"></td>

                    <td class="text-center"
                        th:text="${#temporals.format(n.createdAt, 'dd-MM-yyyy HH:mm')}">
                    </td>

                    <td class="text-center">
                        <span th:if="${!n.isRead}"
                              class="badge bg-warning text-dark">
                            Unread
                        </span>

                        <span th:if="${n.isRead}"
                              class="badge bg-success">
                            Read
                        </span>
                    </td>

                </tr>

                </tbody>

            </table>

        </div>

    </div>

</div>

<!-- Footer -->
<div th:replace="fragments/footer :: footer"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
