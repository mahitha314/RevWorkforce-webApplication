<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Team Performance Reviews</title>

    <th:block th:replace="~{fragments/header :: header('Team Performance Reviews')}"></th:block>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <style>
        body {
            background: #f4f6f9;
        }   

        .content-wrapper {
            margin-left: 240px;   
            margin-top: 80px;     
            padding: 30px;
        }

        .page-title {
            font-weight: 600;
            margin-bottom: 25px;
        }

        .card {
            border-radius: 12px;
            border: none;
        }

        .review-card {
            transition: 0.3s;
        }

        .review-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.08);
        }

        .form-control {
            border-radius: 8px;
        }

        .btn-primary {
            border-radius: 8px;
        }
    </style>
</head>

<body>
  
    <div th:replace="~{fragments/manager-sidebar :: managerSidebar}"></div>
   
    <div th:replace="~{fragments/header :: topbar('Team Performance Reviews')}"></div>
 
    <div class="content-wrapper">

        <div class="container-fluid">

            <h3 class="page-title text-primary">
                Team Performance Reviews
            </h3>

            <div id="reviewsContainer" class="row g-4"></div>

        </div>

    </div>

    <script th:inline="javascript">
        let managerId = /*[[${managerId}]]*/ 0;
    </script>

    <script>
        document.addEventListener("DOMContentLoaded", loadReviews);

        function loadReviews() {

            fetch(`/manager/performance/${managerId}`)
                .then(res => res.json())
                .then(response => {

                    if (response.status !== 200) {
                        Swal.fire("Error", response.message, "error");
                        return;
                    }

                    let reviews = response.data;
                    let container = document.getElementById("reviewsContainer");
                    container.innerHTML = "";

                    if (reviews.length === 0) {
                        container.innerHTML =
                            `<div class="col-12">
                                <div class="alert alert-info">
                                    No performance reviews found.
                                </div>
                             </div>`;
                        return;
                    }

                    reviews.forEach(r => {

                        container.innerHTML += `
                            <div class="col-lg-6">
                                <div class="card review-card p-4 shadow-sm">

                                    <h5 class="fw-bold mb-2">${r.employeeName}</h5>

                                    <p><strong>Status:</strong> ${r.status}</p>
                                    <p><strong>Self Rating:</strong> ⭐ ${r.selfRating}</p>
                                    <p><strong>Accomplishments:</strong><br>${r.accomplishments}</p>
                                    <p><strong>Deliverables:</strong><br>${r.deliverables}</p>
                                    <p><strong>Areas of Improvement:</strong><br>${r.areasOfImprovement}</p>

                                    ${r.status === "Submitted" ? `
                                        <hr>

                                        <div class="mb-3">
                                            <label class="form-label">Manager Rating (1-5)</label>
                                            <input type="number"
                                                id="rating-${r.reviewId}"
                                                class="form-control"
                                                min="1"
                                                max="5">
                                        </div>

                                        <div class="mb-3">
                                            <label class="form-label">Manager Feedback</label>
                                            <textarea
                                                id="feedback-${r.reviewId}"
                                                class="form-control"
                                                rows="3"></textarea>
                                        </div>

                                        <button class="btn btn-primary w-100"
                                            onclick="submitFeedback(${r.reviewId})">
                                            Submit Review
                                        </button>
                                    ` : `
                                        <hr>
                                        <p><strong>Manager Rating:</strong> ⭐ ${r.managerRating}</p>
                                        <p><strong>Manager Feedback:</strong><br>${r.managerFeedback}</p>
                                    `}

                                </div>
                            </div>
                        `;
                    });
                })
                .catch(err => {
                    console.error(err);
                    Swal.fire("Error", "Failed to load reviews", "error");
                });
        }

        function submitFeedback(reviewId) {

            let rating = document.getElementById(`rating-${reviewId}`).value;
            let feedback = document.getElementById(`feedback-${reviewId}`).value;

            if (!rating || !feedback) {
                Swal.fire("Warning", "Please fill rating and feedback", "warning");
                return;
            }

            fetch(`/manager/performance/review/${managerId}`, {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    reviewId: reviewId,
                    managerRating: parseInt(rating),
                    managerFeedback: feedback
                })
            })
                .then(res => res.json())
                .then(response => {

                    if (response.status === 200) {
                        Swal.fire("Success", response.message, "success");
                        loadReviews();
                    } else {
                        Swal.fire("Error", response.message, "error");
                    }
                })
                .catch(err => {
                    console.error(err);
                    Swal.fire("Error", "Submission failed", "error");
                });
        }
    </script>

</body>
</html>
