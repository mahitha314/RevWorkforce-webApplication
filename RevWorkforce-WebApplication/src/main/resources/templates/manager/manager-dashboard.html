<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/header :: header('Manager Dashboard')}">
    <style>
        .profile-card {
            transition: all 0.4s ease;
        }
        .profile-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 40px rgba(0,0,0,0.15);
        }
        .profile-avatar {
            font-size: 80px;
            color: #0d6efd;
            transition: 0.3s ease;
        }
        .profile-avatar:hover {
            transform: scale(1.1);
            color: #084298;
        }
    </style>
</head>

<body>

<!-- Sidebar -->
<div th:replace="~{fragments/manager-sidebar :: managerSidebar}"></div>

<!-- Topbar -->
<div th:replace="~{fragments/header :: topbar('Manager Dashboard')}"></div>

<div class="content">
    <div class="container-fluid">

        <!-- Page Heading -->
        <div class="mb-4">
            <h2 class="fw-bold">Manager Dashboard</h2>
            <p class="text-muted">
                Welcome 
                <strong th:text="${employeeName}">User</strong>,
                here is your team overview.
            </p>
        </div>

        <!-- Dashboard Grid -->
        <div class="row g-4">

            <!-- My Team -->
            <div class="col-lg-6">
                <div class="card shadow-sm border-0 rounded-4 p-4">
                    <h5 class="fw-semibold mb-3">
                        <i class="bi bi-people me-2"></i> My Team
                    </h5>
                    <ul id="teamList" class="list-group list-group-flush"></ul>
                </div>
            </div>

            <!-- Leave Requests -->
            <div class="col-lg-6">
                <div class="card shadow-sm border-0 rounded-4 p-4">
                    <h5 class="fw-semibold mb-3">
                        <i class="bi bi-calendar-check me-2"></i> Leave Requests
                    </h5>
                    <div class="table-responsive">
                        <table class="table align-middle">
                            <thead class="table-light">
                                <tr>
                                    <th>Employee</th>
                                    <th>From</th>
                                    <th>To</th>
                                    <th>Status</th>
                                    <th>Action</th>
                                </tr>
                            </thead>
                            <tbody id="leaveRequests"></tbody>
                        </table>
                    </div>
                </div>
            </div>

            <!-- Performance Reviews -->
            <div class="col-lg-6">
                <div class="card shadow-sm border-0 rounded-4 p-4">
                    <h5 class="fw-semibold mb-3">
                        <i class="bi bi-star me-2"></i> Performance Reviews
                    </h5>
                    <div id="performanceReviews"></div>
                </div>
            </div>

            <!-- Goal Summary -->
            <div class="col-lg-6">
                <div class="card shadow-sm border-0 rounded-4 p-4">
                    <h5 class="fw-semibold mb-3">
                        <i class="bi bi-bullseye me-2"></i> Goal Summary
                    </h5>
                    <div id="goalSummary"></div>
                </div>
            </div>

            <!-- Team Structure -->
            <div class="col-12">
                <div class="card shadow-sm border-0 rounded-4 p-4">
                    <h5 class="fw-semibold mb-3">
                        <i class="bi bi-diagram-3 me-2"></i> Team Structure
                    </h5>
                    <div id="teamStructure"></div>
                </div>
            </div>

        </div>

        <!-- 👤 Manager Profile Section -->
        <div id="profileSection" class="row mt-4" th:if="${manager != null}">
            <div class="col-12">
                <div class="card shadow-lg border-0 rounded-4 p-4 profile-card">

                    <div class="row align-items-center">

                        <!-- Avatar -->
                        <div class="col-md-3 text-center">
                            <div class="profile-avatar">
                                <i class="bi bi-person-circle"></i>
                            </div>
                            <h5 class="mt-3 fw-bold"
                                th:text="${manager.firstName + ' ' + manager.lastName}">
                            </h5>
                            <span class="badge bg-primary"
                                  th:text="${manager.role}"></span>
                        </div>

                        <!-- Details -->
                        <div class="col-md-9">
                            <div class="row g-3">

                                <div class="col-md-6">
                                    <strong>Email:</strong>
                                    <p th:text="${manager.email}"></p>
                                </div>

                                <div class="col-md-6">
                                    <strong>Phone:</strong>
                                    <p th:text="${manager.phoneNumber}"></p>
                                </div>

                                <div class="col-md-6">
                                    <strong>Department:</strong>
                                    <p th:text="${manager.department.name}"></p>
                                </div>

                                <div class="col-md-6">
                                    <strong>Designation:</strong>
                                    <p th:text="${manager.designation.title}"></p>
                                </div>

                                <div class="col-md-6">
                                    <strong>Joining Date:</strong>
                                    <p th:text="${manager.joiningDate}"></p>
                                </div>

                                <div class="col-md-6">
                                    <strong>Status:</strong>
                                    <span class="badge bg-success"
                                          th:text="${manager.status}"></span>
                                </div>

                                <div class="col-12">
                                    <strong>Address:</strong>
                                    <p th:text="${manager.address}"></p>
                                </div>

                            </div>
                        </div>

                    </div>

                </div>
            </div>
        </div>

    </div>
</div>

<script src="/js/manager-dashboard.js"></script>

</body>
</html>
