<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Edit Profile</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            overflow-x: hidden;
        }

        /* Sidebar */
        .sidebar {
            width: 250px;
            min-height: 100vh;
        }

        /* Content area */
        .content-wrapper {
            flex-grow: 1;
        }

        @media (max-width: 991px) {
            .sidebar {
                position: fixed;
                z-index: 1050;
                left: -250px;
                transition: 0.3s;
            }

            .sidebar.active {
                left: 0;
            }
        }
    </style>
</head>
<body>

<div class="d-flex">

    <!-- Sidebar -->
    <div class="sidebar bg-dark text-white p-3" id="sidebar">
        <h4 class="text-white mb-4">Manager</h4>

        <ul class="nav flex-column">
            <li class="nav-item mb-2">
                <a th:href="@{/manager/dashboard}" class="nav-link text-white">Dashboard</a>
            </li>
            <li class="nav-item mb-2">
                <a th:href="@{/manager/profile}" class="nav-link text-white">Profile</a>
            </li>
            <li class="nav-item mb-2">
                <a th:href="@{/logout}" class="nav-link text-white">Logout</a>
            </li>
        </ul>
    </div>

    <!-- Main Content -->
    <div class="content-wrapper">

        <!-- Header -->
        <nav class="navbar navbar-light bg-white shadow-sm px-4">
            <button class="btn btn-outline-secondary d-lg-none"
                    onclick="toggleSidebar()">☰</button>

            <span class="navbar-brand mb-0 h5">Edit Profile</span>
        </nav>

        <!-- Page Content -->
        <div class="container-fluid p-4 bg-light min-vh-100">

            <div th:if="${error}" class="alert alert-danger">
                <span th:text="${error}"></span>
            </div>

            <div class="card shadow rounded-4 border-0 p-4 bg-white">

                <form th:action="@{/manager/update-profile}"
                      th:object="${manager}"
                      method="post">

                    <input type="hidden" th:field="*{id}"/>

                    <h5 class="text-primary mb-3">Personal Information</h5>

                    <div class="row g-3">

                        <div class="col-md-6">
                            <label class="form-label">First Name</label>
                            <input type="text" class="form-control"
                                   th:field="*{firstName}" required>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label">Last Name</label>
                            <input type="text" class="form-control"
                                   th:field="*{lastName}" required>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label">Email</label>
                            <input type="email" class="form-control"
                                   th:field="*{email}" required>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label">Phone</label>
                            <input type="text" class="form-control"
                                   th:field="*{phoneNumber}">
                        </div>

                        <div class="col-12">
                            <label class="form-label">Address</label>
                            <textarea class="form-control"
                                      th:field="*{address}" rows="3"></textarea>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label">Emergency Contact</label>
                            <input type="text" class="form-control"
                                   th:field="*{emergencyContact}">
                        </div>
                    </div>

                    <hr class="my-4">

                    <h5 class="text-danger mb-3">Change Password</h5>

                    <div class="row g-3">
                        <div class="col-md-4">
                            <label class="form-label">Current Password</label>
                            <input type="password" name="currentPassword"
                                   class="form-control">
                        </div>

                        <div class="col-md-4">
                            <label class="form-label">New Password</label>
                            <input type="password" name="newPassword"
                                   class="form-control">
                        </div>

                        <div class="col-md-4">
                            <label class="form-label">Confirm Password</label>
                            <input type="password" name="confirmPassword"
                                   class="form-control">
                        </div>
                    </div>

                    <div class="mt-4">
                        <button type="submit" class="btn btn-primary px-4">
                            Save Changes
                        </button>
                        <a th:href="@{/manager/profile}"
                           class="btn btn-secondary px-4">
                            Cancel
                        </a>
                    </div>

                </form>

            </div>

        </div>

    </div>

</div>

<script>
    function toggleSidebar() {
        document.getElementById("sidebar").classList.toggle("active");
    }
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
