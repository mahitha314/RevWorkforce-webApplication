<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<!-- ================= HEAD FRAGMENT ================= -->
<head th:fragment="header(title)">
    <meta charset="UTF-8">
    <title th:text="${title}">RevWorkForce</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css"
          rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" th:href="@{/css/employee_dashboard.css}">
</head>

<!-- ================= TOPBAR FRAGMENT ================= -->
<div th:fragment="topbar">

    <div class="topbar">

        <!-- LEFT SIDE -->
        <div class="brand-left">
            <img src="/images/rwflogo.png"
                 class="brand-logo"
                 alt="RevWorkForce Logo">

            <div class="brand-text">
                <div class="brand-title">RevWorkForce</div>
                <div class="brand-subtitle">Employee Portal</div>
            </div>
        </div>

        <!-- RIGHT SIDE -->
        <div class="topbar-right">
            Welcome,
            <strong th:text="${employee.firstName}">User</strong>
        </div>

    </div>

</div>

</html>
