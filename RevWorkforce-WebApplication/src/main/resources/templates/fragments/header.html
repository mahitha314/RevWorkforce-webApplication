<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:fragment="header(title)">
    <title th:text="${title}">RevWorkForce</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
	<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

    <style>
		body {
		    margin: 0;
		    padding: 0;
		    font-family: 'Segoe UI', sans-serif;
		    background: #f4f6f9;
		}

		/* SIDEBAR */
		.sidebar {
		    position: fixed;
		    top: 0;
		    left: 0;
		    width: 240px;
		    height: 100vh;
		    background: black;
		    color: white;
		}

		/* TOPBAR */
		.topbar {
		    position: fixed;
		    top: 0;
		    left: 240px;
		    right: 0;
		    height: 70px;
		    background: black;
		    color: white;
		    display: flex;
		    align-items: center;
		    justify-content: space-between;
		    padding: 0 30px;
		}

		/* MAIN CONTENT */
		.content {
		    margin-left: 240px;
		    margin-top: 70px;
		    padding: 30px;
		    min-height: 100vh;
		}
    </style>
</head>

<body th:fragment="topbar">
<div class="topbar">
    <div>
        <strong>RevWorkForce</strong> - Employee Dashboard
    </div>
    <div>
        Welcome... <strong th:text="${#authentication.name}"></strong>
    </div>
</div>
</body>

</html>
