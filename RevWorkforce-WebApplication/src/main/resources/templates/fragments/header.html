<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<!-- ================= HEADER FRAGMENT ================= -->
<head th:fragment="header(title)">

    <title th:text="${title}">RevWorkForce</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" th:href="@{/css/employee_dashboard.css}">

</head>

<!-- ================= TOPBAR FRAGMENT ================= -->
<body th:fragment="topbar">

<div class="topbar d-flex justify-content-between align-items-center">

    <div class="brand-left">
        <img class="brand-logo" src="/images/rwflogo.png" alt="Logo">
        <div>
            <p class="brand-title">RevWorkForce</p>
            <p class="brand-subtitle">Employee Portal</p>
        </div>
    </div>

    <div class="topbar-actions">
        <span>
            Welcome,
            <strong th:text="${employee.firstName}">User</strong>
        </span>
    </div>

</div>

</body>
</html>
