<div th:fragment="managerSidebar">

    <div class="sidebar">

        <h4 class="text-center mb-4">RevWorkForce</h4>

        <!-- Dashboard -->
        <a th:href="@{/manager/dashboard}" class="sidebar-link">
            <i class="bi bi-speedometer2"></i> Dashboard
        </a>

        <!-- My Profile (Scrolls to profile section inside dashboard) -->
        <a th:href="@{/manager/dashboard} + '#profileSection'" class="sidebar-link">
            <i class="bi bi-person-circle"></i> My Profile
        </a>

        <!-- My Team -->
        <a th:href="@{/manager/team/{id}(id=${managerId})}" 
           th:if="${managerId != null}">
            <i class="bi bi-people"></i> My Team
        </a>

        <!-- Leave Requests -->
        <a th:href="@{/manager/leaves/{id}(id=${managerId})}" 
           th:if="${managerId != null}">
            <i class="bi bi-calendar-check"></i> Leave Requests
        </a>

        <!-- Performance Reviews -->
        <a th:href="@{/manager/performance/{id}(id=${managerId})}" 
           th:if="${managerId != null}">
            <i class="bi bi-star"></i> Performance Reviews
        </a>

        <!-- Goals -->
        <a th:href="@{/manager/goals/{id}(id=${managerId})}" 
           th:if="${managerId != null}">
            <i class="bi bi-bullseye"></i> Goals
        </a>

        <!-- Logout -->
        <a th:href="@{/logout}">
            <i class="bi bi-box-arrow-right"></i> Logout
        </a>

    </div>

</div>
