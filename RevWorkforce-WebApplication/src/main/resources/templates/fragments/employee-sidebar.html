<div th:fragment="sidebar" class="sidebar d-flex flex-column">

	<div class="p-3 flex-grow-1">

		<h5 class="fw-bold text-center mb-4 text-white">RevWorkForce</h5>

		<a th:href="@{/employee/dashboard}" class="sidebar-link">
			<i class="bi bi-speedometer2 me-2"></i>
			<span>Dashboard</span>
		</a>

		<a th:href="@{/employee/employee/profile}" class="sidebar-link">
			<i class="bi bi-person-circle me-2"></i>
			<span>Profile</span>
		</a>

		<a th:href="@{/employee/leave}" class="sidebar-link">
			<i class="bi bi-calendar-event me-2"></i>
			<span>Leave Management</span>
		</a>

		<a th:href="@{/employee/directory}" class="sidebar-link">
			<i class="bi bi-people me-2"></i>
			<span>Employee Directory</span>
		</a>

		<a th:href="@{/employee/goals}" class="sidebar-link">
			<i class="bi bi-bullseye me-2"></i>
			<span>Goals</span>
		</a>

		<a th:href="@{/employee/performance}" class="sidebar-link">
			<i class="bi bi-bar-chart-line me-2"></i>
			<span>Performance</span>
		</a>

		<a th:href="@{/employee/announcements}" class="sidebar-link">
			<i class="bi bi-megaphone me-2"></i>
			<span>Announcements</span>
		</a>

		<a th:href="@{/ui/notifications}" th:classappend="${view == 'notifications'} ? ' active' : ''"
			class="sidebar-link">
			<i class="bi bi-bell me-2"></i>
			<span>Notifications</span>
		</a>

		<a th:href="@{/employee/holidays}" class="sidebar-link">
			<i class="bi bi-calendar-check me-2"></i>
			<span>Holiday Calendar</span>
		</a>

		<hr class="bg-light">

		<a th:href="@{/logout}" class="sidebar-link text-danger">
			<i class="bi bi-box-arrow-right me-2"></i>
			<span>Logout</span>
		</a>

	</div>

</div>
