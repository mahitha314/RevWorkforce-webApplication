<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/header :: header('Leave Balance')"></head>

<body>

<div th:replace="fragments/header :: topbar"></div>

<div class="wrapper">
    <div th:replace="fragments/sidebar :: sidebar"></div>

    <div class="main-content">

        <h3 class="mb-4">Leave Balance</h3>

        <div class="card shadow-sm p-4">
            <table class="table table-bordered text-center">
                <thead class="table-dark">
                <tr>
                    <th>Total</th>
                    <th>Used</th>
                    <th>Remaining</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="b : ${balances}">
                    <td th:text="${b.totalLeaves}"></td>
                    <td th:text="${b.usedLeaves}"></td>
                    <td th:text="${b.remainingLeaves}"></td>
                </tr>
                </tbody>
            </table>
        </div>

    </div>
</div>

<div th:replace="fragments/footer :: footer"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
