<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/header :: header('Employee Dashboard')}"></head>

<body>

<div th:replace="~{fragments/header :: topbar('Employee Dashboard')}"></div>

<div class="d-flex">
    
   <div th:replace="~{fragments/employee-sidebar :: sidebar}"></div>
   
    <div class="content flex-grow-1 p-4" style="margin-left:250px;">

        <h2 class="fw-bold mb-4">Dashboard Overview</h2>
     
        <div class="row g-4 mb-4">

            <div class="col-md-3">
                <div class="card shadow-sm text-center p-4 rounded-4">
                    <h6>Total Allocated</h6>
                    <h2 th:text="${totalAllocated} ?: 0">0</h2>
                </div>
            </div>

            <div class="col-md-3">
                <div class="card shadow-sm text-center p-4 rounded-4">
                    <h6>Leaves Used</h6>
                    <h2 class="text-success" th:text="${leavesUsed} ?: 0">0</h2>
                </div>
            </div>

            <div class="col-md-3">
                <div class="card shadow-sm text-center p-4 rounded-4">
                    <h6>Pending Requests</h6>
                    <h2 class="text-warning" th:text="${pendingRequests} ?: 0">0</h2>
                </div>
            </div>

            <div class="col-md-3">
                <div class="card shadow-sm text-center p-4 rounded-4">
                    <h6>Remaining Leaves</h6>
                    <h2 class="text-primary" th:text="${remainingLeaves} ?: 0">0</h2>
                </div>
            </div>

        </div>
     
        <div class="row g-4 mb-4">
          
            <div class="col-md-4">
                <div class="card shadow-sm p-4 rounded-4">
                    <h6>Leave Usage</h6>

                    <p>
                        Used <b th:text="${leavesUsed} ?: 0">0</b> /
                        <span th:text="${totalAllocated} ?: 0">0</span>
                    </p>

                    <div class="progress" style="height:8px;">
                        <div class="progress-bar bg-secondary"
                             th:style="'width:' + (${leaveUsagePercentage} ?: 0) + '%'">
                        </div>
                    </div>

                    <p class="mt-2">
                        Remaining: <b th:text="${remainingLeaves} ?: 0">0</b>
                    </p>
                </div>
            </div>
          
            <div class="col-md-4">
                <div class="card shadow-sm p-4 text-center rounded-4">
                    <h6>Overall Goal Progress</h6>

                    <h3 class="text-success"
                        th:text="(${goalPercentage} ?: 0) + '%'">0%</h3>

                    <div class="progress mt-2" style="height:8px;">
                        <div class="progress-bar bg-success"
                             th:style="'width:' + (${goalPercentage} ?: 0) + '%'">
                        </div>
                    </div>
                </div>
            </div>
            
            <div class="col-md-4">
                <div class="card shadow-sm p-4 text-center rounded-4">
                    <h6>Performance Rating</h6>

                    <h3 class="text-primary"
                        th:text="(${performanceRating} ?: 0) + ' / 5'">0 / 5</h3>

                    <div class="progress mt-2" style="height:8px;">
                        <div class="progress-bar bg-primary"
                             th:style="'width:' + ((${performanceRating} ?: 0) * 20) + '%'">
                        </div>
                    </div>
                </div>
            </div>

        </div>
      
        <div class="card shadow-sm p-4 rounded-4">
            <h5 class="fw-bold mb-4">My Goals</h5>

            <div th:if="${goals != null and !#lists.isEmpty(goals)}">
                <div th:each="goal : ${goals}">

                    <p>
                        <span th:text="${goal.goalTitle}">Goal Title</span>
                        <span class="float-end"
                              th:text="${goal.progress} + '%'">0%</span>
                    </p>

                    <div class="progress mb-3" style="height:6px;">
                        <div class="progress-bar bg-info"
                             th:style="'width:' + ${goal.progress} + '%'">
                        </div>
                    </div>

                </div>
            </div>

            <div th:if="${goals == null or #lists.isEmpty(goals)}">
                <p class="text-muted">No goals assigned yet.</p>
            </div>
        </div>

    </div>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
