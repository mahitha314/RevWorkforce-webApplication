<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="fragments/header :: header('Performance Review')"></head>

<body>

<!-- Sidebar -->
<div th:replace="~{fragments/employee-sidebar :: sidebar}"></div>

<!-- Topbar -->
<div th:replace="fragments/header :: topbar('Performance Review')"></div>

<!-- MAIN CONTENT -->
<div class="content">

    <!-- PAGE HEADER -->
    <div class="mb-4">
        <h3 class="fw-bold">Performance Review</h3>
        <p class="text-muted">
            Submit and track your self performance reviews
        </p>
    </div>

    <!-- Success / Error Messages -->
    <div th:if="${successMessage}" class="alert alert-success">
        <span th:text="${successMessage}"></span>
    </div>

    <div th:if="${errorMessage}" class="alert alert-danger">
        <span th:text="${errorMessage}"></span>
    </div>

    <!-- ================= SELF REVIEW FORM ================= -->
    <div class="card shadow-sm border-0 mb-4">

        <div class="card-header bg-primary text-white fw-bold">
            Submit Self Review
        </div>

        <div class="card-body">

            <form th:action="@{/employee/performance}"
                  method="post"
                  th:object="${review}">

                <div class="mb-3">
                    <label class="form-label">Deliverables</label>
                    <textarea class="form-control"
                              th:field="*{deliverables}"
                              rows="3"></textarea>
                </div>

                <div class="mb-3">
                    <label class="form-label">Accomplishments</label>
                    <textarea class="form-control"
                              th:field="*{accomplishments}"
                              rows="3"></textarea>
                </div>

                <div class="mb-3">
                    <label class="form-label">Areas Of Improvement</label>
                    <textarea class="form-control"
                              th:field="*{areasOfImprovement}"
                              rows="3"></textarea>
                </div>

                <div class="mb-3">
                    <label class="form-label">Self Rating (1-5)</label>
                    <input type="number"
                           min="1"
                           max="5"
                           class="form-control"
                           th:field="*{selfRating}">
                </div>

                <button class="btn btn-primary">
                    Save Self Review
                </button>

                <a th:href="@{/employee/performance}"
                   class="btn btn-secondary ms-2">
                    Cancel
                </a>

            </form>

        </div>

    </div>


    <!-- ================= PREVIOUS REVIEWS ================= -->
    <div class="card shadow-sm border-0">

        <div class="card-header bg-dark text-white fw-bold">
            Previous Reviews
        </div>

        <div class="card-body">

            <div class="table-responsive">

                <table class="table table-bordered table-hover align-middle text-center">

                    <thead class="table-light">
                    <tr>
                        <th>Deliverables</th>
                        <th>Accomplishments</th>
                        <th>Improvement</th>
                        <th>Rating</th>
                        <th>Status</th>
                        <th>Submit</th>
                        <th>Feedback</th>
                    </tr>
                    </thead>

                    <tbody>

                    <tr th:each="review : ${reviews}">

                        <td th:text="${review.deliverables}"></td>
                        <td th:text="${review.accomplishments}"></td>
                        <td th:text="${review.areasOfImprovement}"></td>

                        <td>
                            <span class="badge bg-info text-dark"
                                  th:text="${review.selfRating}">
                            </span>
                        </td>

                        <td>
                            <span th:if="${#strings.equalsIgnoreCase(review.status,'Draft')}"
                                  class="badge bg-warning text-dark">
                                Draft
                            </span>

                            <span th:if="${#strings.equalsIgnoreCase(review.status,'Submitted')}"
                                  class="badge bg-success">
                                Submitted
                            </span>
                        </td>

                        <!-- ✅ FIXED HERE -->
                        <td>
                            <a th:if="${#strings.equalsIgnoreCase(review.status,'Draft')}"
                               th:href="@{/employee/performance/submit/{rid}(rid=${review.id})}"
                               class="btn btn-sm btn-outline-primary">
                                Submit
                            </a>

                            <span th:if="${#strings.equalsIgnoreCase(review.status,'Submitted')}"
                                  class="text-muted">
                                Already Submitted
                            </span>
                        </td>

                        <!-- ✅ FIXED HERE -->
                        <td>
                            <a th:if="${#strings.equalsIgnoreCase(review.status,'Submitted')}"
                               th:href="@{/employee/performance/feedback/{rid}(rid=${review.id})}"
                               class="btn btn-sm btn-outline-success">
                                View
                            </a>

                            <span th:if="${#strings.equalsIgnoreCase(review.status,'Draft')}"
                                  class="text-muted">
                                Not Available
                            </span>
                        </td>

                    </tr>

                    <tr th:if="${#lists.isEmpty(reviews)}">
                        <td colspan="7" class="text-muted">
                            No performance reviews available.
                        </td>
                    </tr>

                    </tbody>

                </table>

            </div>

        </div>

    </div>

</div>

<!-- Footer -->
<div th:replace="fragments/footer :: footer"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
