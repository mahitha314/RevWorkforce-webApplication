<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <th:block th:replace="fragments/header :: header('Performance Review')"></th:block>
</head>

<body>

<div th:replace="fragments/employee-sidebar :: sidebar"></div>
<div th:replace="fragments/header :: topbar('Performance Review')"></div>

<div class="content">

    <div class="mb-4">
        <h3 class="fw-bold">Performance Review</h3>
        <p class="text-muted">
            Submit and track your self performance reviews
        </p>
    </div>

    
    <div th:if="${successMessage}" class="alert alert-success"
         th:text="${successMessage}"></div>

    <div th:if="${errorMessage}" class="alert alert-danger"
         th:text="${errorMessage}"></div>

   
    <div class="card shadow-sm border-0 mb-4">

        <div class="card-header bg-primary text-white fw-bold">
            Submit Self Review
        </div>

        <div class="card-body">

            <form id="reviewForm"
                  th:action="@{/employee/performance}"
                  method="post"
                  th:object="${review}">

                <div class="mb-3">
                    <label class="form-label">Deliverables</label>
                    <textarea class="form-control"
                              th:field="*{deliverables}"
                              rows="3" required></textarea>
                </div>

                <div class="mb-3">
                    <label class="form-label">Accomplishments</label>
                    <textarea class="form-control"
                              th:field="*{accomplishments}"
                              rows="3" required></textarea>
                </div>

                <div class="mb-3">
                    <label class="form-label">Areas Of Improvement</label>
                    <textarea class="form-control"
                              th:field="*{areasOfImprovement}"
                              rows="3"></textarea>
                </div>

                <div class="mb-3">
                    <label class="form-label">Self Rating (1-5)</label>
                    <input type="number"
                           id="selfRating"
                           class="form-control"
                           min="1"
                           max="5"
                           th:field="*{selfRating}"
                           required>
                </div>

                <button type="button"
                        id="saveBtn"
                        class="btn btn-primary">
                    Save Self Review
                </button>

            </form>

        </div>
    </div>

   
    <div class="card shadow-sm border-0">

        <div class="card-header bg-dark text-white fw-bold">
            Previous Reviews
        </div>

        <div class="card-body">

            <div class="table-responsive">

                <table class="table table-bordered table-hover text-center align-middle">

                    <thead class="table-light">
                    <tr>
                        <th>Deliverables</th>
                        <th>Accomplishments</th>
                        <th>Improvement</th>
                        <th>Self Rating</th>
                        <th>Manager Rating</th>
                        <th>Manager Feedback</th>
                        <th>Status</th>
                    </tr>
                    </thead>

                    <tbody>

                    <tr th:each="r : ${reviews}">

                        <td th:text="${r.deliverables}"></td>
                        <td th:text="${r.accomplishments}"></td>
                        <td th:text="${r.areasOfImprovement}"></td>

                        <td>
                            <span class="badge bg-info text-dark"
                                  th:text="${r.selfRating}"></span>
                        </td>

                        <td>
                            <span th:if="${r.managerRating > 0}"
                                  class="badge bg-success"
                                  th:text="${r.managerRating}"></span>

                            <span th:if="${r.managerRating == 0}"
                                  class="text-muted">
                                Not Reviewed
                            </span>
                        </td>

                        <td>
                            <span th:if="${r.managerFeedback != null}"
                                  th:text="${r.managerFeedback}"></span>

                            <span th:if="${r.managerFeedback == null}"
                                  class="text-muted">
                                Waiting for feedback
                            </span>
                        </td>

                        <td>

                            <span th:if="${r.status == 'Draft'}"
                                  class="badge bg-warning text-dark">
                                Draft
                            </span>

                            <span th:if="${r.status == 'Submitted'}"
                                  class="badge bg-primary">
                                Submitted
                            </span>

                            <span th:if="${r.status == 'Reviewed'}"
                                  class="badge bg-success">
                                Reviewed
                            </span>

                            <div th:if="${r.status == 'Draft'}" class="mt-2">
                                <a th:href="@{/employee/performance/submit/{id}(id=${r.id})}"
                                   class="btn btn-sm btn-outline-primary">
                                    Submit
                                </a>
                            </div>

                        </td>

                    </tr>

                    <tr th:if="${#lists.isEmpty(reviews)}">
                        <td colspan="7" class="text-muted">
                            No performance reviews available
                        </td>
                    </tr>

                    </tbody>

                </table>

            </div>

        </div>
    </div>

</div>

<div th:replace="fragments/footer :: footer"></div>

<script>
window.onload = function () {

    const form = document.getElementById("reviewForm");
    const rating = document.getElementById("selfRating");
    const saveBtn = document.getElementById("saveBtn");

    saveBtn.addEventListener("click", function () {

        let value = parseInt(rating.value);

        if (isNaN(value) || value < 1 || value > 5) {
            alert("Rating must be between 1 and 5");
            return;
        }

        form.submit();
    });
};
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
