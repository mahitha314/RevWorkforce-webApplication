<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Performance Review</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div class="container mt-5">

    <h2 class="mb-4">Performance Review</h2>

    <!-- Create Review Form -->
    <div class="card mb-4">
        <div class="card-header">Create Review</div>
        <div class="card-body">
            <form th:action="@{/employee/performance/{employeeId}(employeeId=${employeeId})}"
                  th:object="${review}" method="post">

                <div class="mb-3">
                    <label>Deliverables</label>
                    <textarea class="form-control" th:field="*{deliverables}" required></textarea>
                </div>

                <div class="mb-3">
                    <label>Accomplishments</label>
                    <textarea class="form-control" th:field="*{accomplishments}" required></textarea>
                </div>

                <div class="mb-3">
                    <label>Areas of Improvement</label>
                    <textarea class="form-control" th:field="*{areasOfImprovement}"></textarea>
                </div>

                <div class="mb-3">
                    <label>Self Rating (1-5)</label>
                    <input type="number" min="1" max="5"
                           class="form-control"
                           th:field="*{selfRating}" required>
                </div>

                <button type="submit" class="btn btn-primary">
                    Save Draft
                </button>
            </form>
        </div>
    </div>

    <!-- Review List -->
    <table class="table table-bordered">
        <thead class="table-dark">
        <tr>
            <th>Review ID</th>
            <th>Status</th>
            <th>Manager Feedback</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="r : ${reviews}">
            <td th:text="${r.reviewId}"></td>
            <td th:text="${r.status}"></td>
            <td th:text="${r.managerFeedback}"></td>
        </tr>
        </tbody>
    </table>

</div>

</body>
</html>
