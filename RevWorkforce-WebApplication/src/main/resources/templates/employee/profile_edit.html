<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="fragments/header :: header('Update Profile')"></head>

<body>

<div th:replace="fragments/sidebar :: sidebar"></div>
<div th:replace="fragments/header :: topbar"></div>

<div class="content">

    <h3 class="fw-bold mb-4">✏ Update Profile</h3>

    <div th:if="${errorMessage}" class="alert alert-danger">
        <span th:text="${errorMessage}"></span>
    </div>

    <div class="card shadow-sm border-0 p-4">

        <form th:action="@{/employee/profile/update-all}"
              method="post"
              th:object="${employee}">

            <div class="row g-3">

                <!-- Read Only -->
                <div class="col-md-6">
                    <label class="form-label">First Name</label>
                    <input class="form-control"
                           th:value="*{firstName}"
                           readonly>
                </div>

                <div class="col-md-6">
                    <label class="form-label">Last Name</label>
                    <input class="form-control"
                           th:value="*{lastName}"
                           readonly>
                </div>

                <div class="col-md-6">
                    <label class="form-label">Email</label>
                    <input class="form-control"
                           th:value="*{email}"
                           readonly>
                </div>

                <div class="col-md-6">
                    <label class="form-label">Department</label>
                    <input class="form-control"
                           th:value="${employee.department.name}"
                           readonly>
                </div>

                <div class="col-md-6">
                    <label class="form-label">Designation</label>
                    <input class="form-control"
                           th:value="${employee.designation.title}"
                           readonly>
                </div>

                <hr class="mt-4">

                <!-- Editable -->
                <div class="col-md-6">
                    <label class="form-label">Phone Number</label>
                    <input class="form-control"
                           th:field="*{phoneNumber}"
                           maxlength="10">
                </div>

                <div class="col-md-6">
                    <label class="form-label">Emergency Contact</label>
                    <input class="form-control"
                           th:field="*{emergencyContact}"
                           maxlength="10">
                </div>

                <div class="col-md-12">
                    <label class="form-label">Address</label>
                    <input class="form-control"
                           th:field="*{address}">
                </div>

                <hr class="mt-4">

                <!-- Password -->
                <h5 class="fw-bold mt-3">🔐 Change Password</h5>

                <div class="col-md-4">
                    <label class="form-label">Old Password</label>
                    <input type="password"
                           name="oldPassword"
                           class="form-control">
                </div>

                <div class="col-md-4">
                    <label class="form-label">New Password</label>
                    <input type="password"
                           name="newPassword"
                           class="form-control">
                </div>

                <div class="col-md-4">
                    <label class="form-label">Confirm Password</label>
                    <input type="password"
                           name="confirmPassword"
                           class="form-control">
                </div>

                <div class="col-md-12 mt-4">
                    <button class="btn btn-success">
                        Save All Changes
                    </button>

                    <a th:href="@{/employee/profile}"
                       class="btn btn-secondary ms-2">
                        Cancel
                    </a>
                </div>

            </div>

        </form>

    </div>

</div>

<div th:replace="fragments/footer :: footer"></div>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
