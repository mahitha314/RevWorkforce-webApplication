<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="fragments/header :: header('Announcements')"></head>

<body>

<!-- Sidebar -->
<div th:replace="fragments/sidebar :: sidebar"></div>

<!-- Topbar -->
<div th:replace="fragments/header :: topbar"></div>

<!-- MAIN CONTENT -->
<div class="content">

    <h3 class="fw-bold mb-4">📢 Announcements</h3>

    <div class="card shadow-sm border-0 p-4">

        <!-- If No Announcements -->
        <div th:if="${#lists.isEmpty(announcements)}"
             class="text-center py-4">

            <h5>No announcements available at the moment.</h5>
            <p class="text-muted">
                Please check back later for updates from management.
            </p>

        </div>

        <!-- If Announcements Exist -->
        <div th:if="${!#lists.isEmpty(announcements)}">

            <div class="list-group list-group-flush">

                <div class="list-group-item mb-3 rounded shadow-sm"
                     th:each="announcement : ${announcements}">

                    <h5 class="fw-bold mb-1"
                        th:text="${announcement.title}">
                    </h5>

                    <small class="text-muted"
                           th:text="${announcement.postedDate}">
                    </small>

                    <p class="mt-2"
                       th:text="${announcement.message}">
                    </p>

                </div>

            </div>

        </div>

    </div>

</div>

<!-- Footer -->
<div th:replace="fragments/footer :: footer"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
