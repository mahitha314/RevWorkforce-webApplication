<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="fragments/header :: header('Announcements')"></head>

<body>

<div th:replace="fragments/header :: topbar"></div>

<div class="app-layout">

    <div th:replace="fragments/sidebar :: sidebar"></div>

    <div class="main-content">

        <h3 class="mb-4">Announcements</h3>

        <div class="card shadow-sm p-4">

            <div th:if="${#lists.isEmpty(announcements)}"
                 class="text-center">

                <h5>No announcements available at the moment.</h5>
                <p class="text-muted">
                    Please check back later for updates from management.
                </p>

            </div>

        </div>

    </div>

</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
