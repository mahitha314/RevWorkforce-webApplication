<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/header :: header('Notifications')"></head>

<body>

<div th:replace="fragments/header :: topbar"></div>

<div class="wrapper">

    <div th:replace="fragments/sidebar :: sidebar"></div>

    <div class="main-content">

        <h3 class="mb-4">🔔 Notifications</h3>

        <div class="card p-4 shadow-sm">

            <div th:if="${#lists.isEmpty(notifications)}"
                 class="alert alert-info">
                You currently have no notifications.
            </div>

            <table th:if="${!#lists.isEmpty(notifications)}"
                   class="table table-bordered table-hover">

                <thead class="table-dark">
                <tr>
                    <th>Message</th>
                    <th>Date</th>
                    <th>Status</th>
                </tr>
                </thead>

                <tbody>
                <tr th:each="n : ${notifications}">
                    <td th:text="${n.message}"></td>
                    <td th:text="${#temporals.format(n.createdAt, 'dd-MM-yyyy HH:mm')}"></td>
                    <td th:text="${n.status}"></td>
                </tr>
                </tbody>

            </table>

        </div>

    </div>
</div>

<div th:replace="fragments/footer :: footer"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
