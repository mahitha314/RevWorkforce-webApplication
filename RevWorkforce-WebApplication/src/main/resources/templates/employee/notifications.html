<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Notifications | RevWorkForce</title>
    <th:block th:replace="~{fragments/header :: header('Notifications')}"></th:block>

    <style>
        body {
            background-color: #f5f6fa;
        }

        .content-wrapper {
            margin-left: 250px;
            padding: 100px 20px 30px 20px;
            min-height: 100vh;
            transition: 0.3s;
        }

        @media (max-width: 991px) {
            .content-wrapper {
                margin-left: 0;
                padding-top: 110px;
            }
        }

        .notification-card:hover {
            background-color: #f8f9fa;
            transition: 0.3s;
        }
    </style>
</head>

<body>

    <!-- TOPBAR -->
    <div th:replace="fragments/header :: topbar('Notifications')"></div>

    <!-- SIDEBAR -->
    <div th:replace="fragments/employee-sidebar :: sidebar"></div>

    <div class="content-wrapper">
        <div class="container-fluid">
            <div class="row justify-content-center">
                <div class="col-12 col-lg-10 col-xl-9">

                    <div class="card shadow border-0 rounded-4">
                        <div class="card-body p-4 p-md-5">

                            <!-- Header -->
                            <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center mb-4 gap-3">
                                <h3 class="fw-bold mb-0">
                                    <i class="bi bi-bell text-primary me-2"></i>
                                    My Notifications
                                </h3>

                                <div class="d-flex align-items-center gap-3">
                                    <span class="fw-semibold">Unread:</span>
                                    <span class="badge bg-danger fs-6 px-3 py-2"
                                          th:text="${unreadCount}">0</span>

										  <button type="button" class="btn btn-primary btn-sm px-3" onclick="markAllRead()">
										      Mark All Read
										  </button>
                                </div>
                            </div>

                            <!-- Notification List -->
                            <div th:if="${not #lists.isEmpty(notifications)}">
                                <div th:each="notification : ${notifications}"
                                     th:class="'card mb-3 shadow-sm notification-card ' + (${notification.isRead} ? '' : 'border-start border-4 border-primary')">

                                    <div class="card-body">
                                        <div class="d-flex justify-content-between align-items-start">
                                            <div>
                                                <h6 class="fw-bold mb-1" th:text="${notification.message}">
                                                    Notification message
                                                </h6>

                                                <small class="text-muted"
                                                       th:text="${#temporals.format(notification.createdAt,'dd/MM/yyyy, hh:mm:ss a')}">
                                                    12/03/2026, 10:30:00 AM
                                                </small>
                                            </div>

                                            <span th:if="${!notification.isRead}" class="badge bg-primary">New</span>
                                        </div>

										<div class="mt-3 d-flex gap-2">
										    <button th:if="${!notification.isRead}"
										            type="button"
										            class="btn btn-success btn-sm"
										            th:attr="onclick='markRead(' + ${notification.notificationId} + ')'">
										        Mark Read
										    </button>

										    <button type="button"
										            class="btn btn-danger btn-sm"
										            th:attr="onclick='deleteNotification(' + ${notification.notificationId} + ')'">
										        Delete
										    </button>
										</div>
										
                                    </div>
                                </div>
                            </div>

                            <!-- Empty State -->
                            <div th:if="${#lists.isEmpty(notifications)}" class="text-center text-muted py-5">
                                <i class="bi bi-bell fs-1"></i>
                                <p class="mt-3 mb-0">No notifications available</p>
                            </div>

                        </div>
                    </div>

                </div>
            </div>
        </div>
    </div>

	<script>
	    async function markRead(id) {
	        try {
	            const response = await fetch(`/notifications/${id}/read`, {
	                method: "PUT",
	                credentials: "include"
	            });

	            if (!response.ok) {
	                throw new Error("Failed to mark notification as read");
	            }

	            window.location.reload();
	        } catch (error) {
	            console.error(error);
	            alert("Unable to mark notification as read");
	        }
	    }

	    async function deleteNotification(id) {
	        try {
	            const response = await fetch(`/notifications/${id}`, {
	                method: "DELETE",
	                credentials: "include"
	            });

	            if (!response.ok) {
	                throw new Error("Failed to delete notification");
	            }

	            window.location.reload();
	        } catch (error) {
	            console.error(error);
	            alert("Unable to delete notification");
	        }
	    }

	    async function markAllRead() {
	        try {
	            const response = await fetch(`/notifications/read-all`, {
	                method: "PUT",
	                credentials: "include"
	            });

	            if (!response.ok) {
	                throw new Error("Failed to mark all notifications as read");
	            }

	            window.location.reload();
	        } catch (error) {
	            console.error(error);
	            alert("Unable to mark all notifications as read");
	        }
	    }
	</script>
	
</body>
</html>
