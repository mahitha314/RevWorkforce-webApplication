<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/header :: header('My Goals')"></head>

<body>

<div th:replace="fragments/header :: topbar"></div>

<div class="wrapper">

    <div th:replace="fragments/sidebar :: sidebar"></div>

    <div class="main-content">

        <h3 class="mb-4">🎯 My Goals</h3>

        <div th:if="${successMessage}" class="alert alert-success">
            <span th:text="${successMessage}"></span>
        </div>

        <div class="card p-4 shadow-sm mb-4">
            <form th:action="@{/employee/goals}" method="post" th:object="${goal}">
                <div class="row">
                    <div class="col-md-4 mb-3">
                        <label>Description</label>
                        <input type="text" class="form-control"
                               th:field="*{goalDescription}" required>
                    </div>

                    <div class="col-md-3 mb-3">
                        <label>Priority</label>
                        <select class="form-control" th:field="*{priority}">
                            <option value="LOW">LOW</option>
                            <option value="MEDIUM">MEDIUM</option>
                            <option value="HIGH">HIGH</option>
                        </select>
                    </div>

                    <div class="col-md-3 mb-3">
                        <label>Deadline</label>
                        <input type="date" class="form-control"
                               th:field="*{deadline}" required>
                    </div>

                    <div class="col-md-2 d-flex align-items-end">
                        <button class="btn btn-success w-100">Add Goal</button>
                    </div>
                </div>
            </form>
        </div>

        <div class="card shadow-sm p-4">
            <table class="table table-bordered table-hover">
                <thead class="table-dark">
                <tr>
                    <th>Description</th>
                    <th>Priority</th>
                    <th>Status</th>
                    <th>Deadline</th>
                    <th>Action</th>
                    <th>Delete</th>
                </tr>
                </thead>

                <tbody>
                <tr th:each="goal : ${goals}">
                    <td th:text="${goal.goalDescription}"></td>
                    <td th:text="${goal.priority}"></td>
                    <td th:text="${goal.status}"></td>
                    <td th:text="${goal.deadline}"></td>

                    <td>
                        <a th:if="${goal.status == 'Not Started'}"
                           th:href="@{/employee/goals/status/{id}(id=${goal.goalId},status='In Progress')}"
                           class="btn btn-sm btn-primary">Start</a>

                        <a th:if="${goal.status == 'In Progress'}"
                           th:href="@{/employee/goals/status/{id}(id=${goal.goalId},status='Completed')}"
                           class="btn btn-sm btn-success">Complete</a>

                        <span th:if="${goal.status == 'Completed'}"
                              class="badge bg-success">Completed</span>
                    </td>

                    <td>
                        <a th:if="${goal.status != 'Completed'}"
                           th:href="@{/employee/goals/delete/{id}(id=${goal.goalId})}"
                           class="btn btn-sm btn-danger">Delete</a>
                    </td>
                </tr>

                <tr th:if="${#lists.isEmpty(goals)}">
                    <td colspan="6" class="text-center text-muted">
                        No Goals Found
                    </td>
                </tr>

                </tbody>
            </table>
        </div>

    </div>
</div>

<div th:replace="fragments/footer :: footer"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
