<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="fragments/header :: header('My Goals')"></head>

<body>

<div th:replace="fragments/sidebar :: sidebar"></div>
<div th:replace="fragments/header :: topbar"></div>

<div class="content">

    <h3 class="fw-bold mb-4">🎯 My Goals</h3>

    <!-- ================= ADD GOAL FORM ================= -->
    <div class="card shadow-sm border-0 p-4 mb-4">

        <form th:action="@{/employee/goals}" method="post" th:object="${goal}">

            <div class="row g-3">

                <div class="col-md-4">
                    <label class="form-label">Description</label>
                    <input type="text"
                           class="form-control"
                           th:field="*{goalDescription}"
                           required>
                </div>

                <div class="col-md-3">
                    <label class="form-label">Priority</label>
                    <select class="form-select" th:field="*{priority}">
                        <option value="LOW">LOW</option>
                        <option value="MEDIUM">MEDIUM</option>
                        <option value="HIGH">HIGH</option>
                    </select>
                </div>

                <div class="col-md-3">
                    <label class="form-label">Deadline</label>
                    <input type="date"
                           class="form-control"
                           th:field="*{deadline}"
                           required>
                </div>

                <div class="col-md-2 d-flex align-items-end">
                    <button class="btn btn-success w-100">
                        Add Goal
                    </button>
                </div>

            </div>

        </form>

    </div>

    <!-- ================= GOAL TABLE ================= -->
    <div class="card shadow-sm border-0 p-4">

        <div class="table-responsive">

            <table class="table table-bordered table-hover align-middle text-center">

                <thead class="table-dark">
                <tr>
                    <th>Description</th>
                    <th>Priority</th>
                    <th>Status</th>
                    <th>Deadline</th>
                    <th width="220px">Progress</th>
                    <th>Update</th>
                </tr>
                </thead>

                <tbody>

                <tr th:each="goal : ${goals}">

                    <td th:text="${goal.goalDescription}"></td>

                    <!-- ✅ UPDATED SUBTLE PRIORITY COLORS -->
                    <td>
                        <span th:if="${goal.priority == 'LOW'}"
                              class="badge priority-low">
                            LOW
                        </span>

                        <span th:if="${goal.priority == 'MEDIUM'}"
                              class="badge priority-medium">
                            MEDIUM
                        </span>

                        <span th:if="${goal.priority == 'HIGH'}"
                              class="badge priority-high">
                            HIGH
                        </span>
                    </td>

                    <td>
                        <span th:if="${goal.progress == 0}"
                              class="badge bg-secondary">
                            Not Started
                        </span>

                        <span th:if="${goal.progress > 0 and goal.progress < 100}"
                              class="badge bg-warning text-dark">
                            In Progress
                        </span>

                        <span th:if="${goal.progress == 100}"
                              class="badge bg-success">
                            Completed
                        </span>
                    </td>

                    <td th:text="${goal.deadline}"></td>

                    <!-- Progress Bar -->
                    <td>
                        <div class="progress" style="height: 20px;">

                            <div th:if="${goal.progress <= 35}"
                                 class="progress-bar bg-danger"
                                 th:style="'width:' + ${goal.progress} + '%'">
                            </div>

                            <div th:if="${goal.progress > 35 and goal.progress < 100}"
                                 class="progress-bar bg-warning"
                                 th:style="'width:' + ${goal.progress} + '%'">
                            </div>

                            <div th:if="${goal.progress == 100}"
                                 class="progress-bar bg-success"
                                 th:style="'width:' + ${goal.progress} + '%'">
                            </div>

                        </div>

                        <div class="mt-1 fw-bold"
                             th:text="${goal.progress + '%'}">
                        </div>
                    </td>

                    <!-- Update Progress -->
                    <td>

                        <form th:action="@{/employee/goals/update-progress/{id}(id=${goal.id})}"
                              method="post"
                              class="d-flex">

                            <input type="number"
                                   name="progress"
                                   min="0"
                                   max="100"
                                   th:value="${goal.progress}"
                                   class="form-control form-control-sm me-2">

                            <button class="btn btn-sm btn-success">
                                Update
                            </button>
                        </form>

                    </td>

                </tr>

                <tr th:if="${#lists.isEmpty(goals)}">
                    <td colspan="6" class="text-muted">
                        No Goals Found
                    </td>
                </tr>

                </tbody>

            </table>

        </div>

    </div>

</div>

<div th:replace="fragments/footer :: footer"></div>

<!-- ✅ Subtle Priority Color Styles -->
<style>
.priority-low {
    background-color: #6c757d;
    color: white;
}

.priority-medium {
    background-color: #f8d66d;
    color: #000;
}

.priority-high {
    background-color: #ef9a9a;
    color: #000;
}
</style>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
