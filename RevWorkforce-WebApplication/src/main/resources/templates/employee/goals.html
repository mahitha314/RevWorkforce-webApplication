<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>My Goals</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div class="container mt-5">

    <h2 class="mb-4">My Goals</h2>

    <!-- Create Goal Form -->
    <div class="card mb-4">
        <div class="card-header">Create Goal</div>
        <div class="card-body">
            <form th:action="@{/employee/goals/{employeeId}(employeeId=${employeeId})}"
                  th:object="${goal}" method="post">

                <div class="mb-3">
                    <label>Goal Description</label>
                    <textarea class="form-control" th:field="*{goalDescription}" required></textarea>
                </div>

                <div class="mb-3">
                    <label>Priority</label>
                    <select class="form-control" th:field="*{priority}">
                        <option value="High">High</option>
                        <option value="Medium">Medium</option>
                        <option value="Low">Low</option>
                    </select>
                </div>

                <div class="mb-3">
                    <label>Deadline</label>
                    <input type="date" class="form-control" th:field="*{deadline}" required>
                </div>

                <button type="submit" class="btn btn-primary">Save Goal</button>
            </form>
        </div>
    </div>

    <!-- Goal List -->
    <table class="table table-bordered">
        <thead class="table-dark">
        <tr>
            <th>Description</th>
            <th>Priority</th>
            <th>Status</th>
            <th>Deadline</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="g : ${goals}">
            <td th:text="${g.goalDescription}"></td>
            <td th:text="${g.priority}"></td>
            <td>
                <span class="badge bg-warning"
                      th:if="${g.status == 'Not Started'}"
                      th:text="${g.status}"></span>

                <span class="badge bg-info"
                      th:if="${g.status == 'In Progress'}"
                      th:text="${g.status}"></span>

                <span class="badge bg-success"
                      th:if="${g.status == 'Completed'}"
                      th:text="${g.status}"></span>
            </td>
            <td th:text="${g.deadline}"></td>
        </tr>
        </tbody>
    </table>

</div>

</body>
</html>
