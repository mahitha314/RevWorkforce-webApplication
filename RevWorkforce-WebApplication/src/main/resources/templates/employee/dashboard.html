<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/header :: header('Dashboard')"></head>

<body>

<div th:replace="fragments/header :: topbar"></div>

<div class="wrapper">

    <div th:replace="fragments/sidebar :: sidebar"></div>

    <div class="main-content">

        <h3 class="fw-bold mb-4">Dashboard Overview</h3>

        <!-- ================= SUMMARY CARDS ================= -->
        <div class="row g-4 mb-4">

            <div class="col-md-3">
                <div class="card shadow-sm p-3 border-0">
                    <h6>Total Allocated</h6>
                    <h2 th:text="${totalAllocated}">0</h2>
                </div>
            </div>

            <div class="col-md-3">
                <div class="card shadow-sm p-3 border-0">
                    <h6>Leaves Used</h6>
                    <h2 class="text-success"
                        th:text="${totalUsed}">0</h2>
                </div>
            </div>

            <div class="col-md-3">
                <div class="card shadow-sm p-3 border-0">
                    <h6>Pending Requests</h6>
                    <h2 class="text-warning"
                        th:text="${pendingCount}">0</h2>
                </div>
            </div>

            <div class="col-md-3">
                <div class="card shadow-sm p-3 border-0">
                    <h6>Remaining Leaves</h6>
                    <h2 class="text-primary"
                        th:text="${totalRemaining}">0</h2>
                </div>
            </div>

        </div>

        <!-- ================= VISUAL SECTION ================= -->
        <div class="row g-4">

            <!-- Leave Usage Progress -->
            <div class="col-md-4">
                <div class="card shadow-sm p-4 border-0">
                    <h6 class="fw-bold mb-3">Leave Usage</h6>

                    <p class="small text-muted">
                        Used 
                        <strong th:text="${totalUsed}"></strong> /
                        <strong th:text="${totalAllocated}"></strong>
                    </p>

                    <!-- SAFE VERSION -->
                    <div class="progress" style="height:10px;">
                        <div class="progress-bar bg-danger"
                             th:style="'width:' + ${totalAllocated > 0 ? totalUsed * 100 / totalAllocated : 0} + '%'">
                        </div>
                    </div>

                    <p class="small mt-2">
                        Remaining:
                        <strong th:text="${totalRemaining}"></strong>
                    </p>
                </div>
            </div>

            <!-- Goals Progress -->
            <div class="col-md-4">
                <div class="card shadow-sm p-4 border-0">
                    <h6 class="fw-bold mb-3">Goals Progress</h6>

                    <div th:if="${goals != null and !#lists.isEmpty(goals)}">

                        <div th:each="goal : ${goals}">
                            <small th:text="${goal.goalDescription}"></small>

                            <div class="progress mb-2" style="height:8px;">
                                <div class="progress-bar bg-success"
                                     th:style="'width:' + ${goal.progress} + '%'">
                                </div>
                            </div>
                        </div>

                    </div>

                    <div th:if="${goals == null or #lists.isEmpty(goals)}"
                         class="text-muted small">
                        No goals assigned.
                    </div>

                </div>
            </div>

            <!-- Performance Overview -->
            <div class="col-md-4">
                <div class="card shadow-sm p-4 border-0 text-center">
                    <h6 class="fw-bold mb-3">Performance Rating</h6>

                    <h2 class="text-primary">4/5</h2>

                    <div class="progress mt-2" style="height:8px;">
                        <div class="progress-bar bg-primary"
                             style="width:80%;">
                        </div>
                    </div>

                    <small class="text-muted d-block mt-2">
                        Based on recent activity
                    </small>
                </div>
            </div>

        </div>

    </div>
</div>

<div th:replace="fragments/footer :: footer"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
