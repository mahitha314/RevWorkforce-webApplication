<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <th:block th:replace="~{fragments/header :: header('Dashboard')}"></th:block>

    <style>
        body {
            margin: 0;
            background-color: #f4f6f9;
            font-family: 'Segoe UI', sans-serif;
        }

        /* Push below fixed header */
        .layout-container {
            margin-top: 60px;
        }

        /* FIX CONTENT PROPERLY */
        .content-area {
            margin-left: 250px;   /* sidebar width */
            padding: 30px;
            box-sizing: border-box;
        }

        .card {
            border-radius: 12px;
        }

        .progress {
            border-radius: 8px;
        }
    </style>
</head>

<body>

<!-- HEADER -->
<div th:replace="~{fragments/header :: topbar}"></div>

<div class="layout-container">

    <!-- SIDEBAR -->
    <div th:replace="~{fragments/sidebar :: sidebar}"></div>

    <!-- MAIN CONTENT -->
    <div class="content-area">

       

        <!-- KEEP ALL YOUR EXISTING CONTENT HERE (unchanged) -->

        <h3 class="fw-bold mb-4">Dashboard Overview</h3>

        <!-- SUMMARY CARDS -->
        <div class="row g-4 mb-4">

            <div class="col-md-3 col-sm-6">
                <div class="card shadow-sm p-3 border-0 text-center">
                    <h6>Total Allocated</h6>
                    <h2 th:text="${totalAllocated}">0</h2>
                </div>
            </div>

            <div class="col-md-3 col-sm-6">
                <div class="card shadow-sm p-3 border-0 text-center">
                    <h6>Leaves Used</h6>
                    <h2 class="text-success" th:text="${totalUsed}">0</h2>
                </div>
            </div>

            <div class="col-md-3 col-sm-6">
                <div class="card shadow-sm p-3 border-0 text-center">
                    <h6>Pending Requests</h6>
                    <h2 class="text-warning" th:text="${pendingCount}">0</h2>
                </div>
            </div>

            <div class="col-md-3 col-sm-6">
                <div class="card shadow-sm p-3 border-0 text-center">
                    <h6>Remaining Leaves</h6>
                    <h2 class="text-primary" th:text="${totalRemaining}">0</h2>
                </div>
            </div>

        </div>

        <!-- VISUAL SECTION -->
        <div class="row g-4">

            <div class="col-lg-4 col-md-6">
                <div class="card shadow-sm p-4 border-0">
                    <h6 class="fw-bold mb-3">Leave Usage</h6>

                    <p class="small text-muted">
                        Used 
                        <strong th:text="${totalUsed}"></strong> /
                        <strong th:text="${totalAllocated}"></strong>
                    </p>

                    <div class="progress" style="height:10px;">
                        <div class="progress-bar bg-danger"
                             th:style="'width:' + ${totalAllocated > 0 ? (totalUsed * 100 / totalAllocated) : 0} + '%'">
                        </div>
                    </div>

                    <p class="small mt-2">
                        Remaining:
                        <strong th:text="${totalRemaining}"></strong>
                    </p>
                </div>
            </div>

            <div class="col-lg-4 col-md-6">
                <div class="card shadow-sm p-4 border-0 text-center">
                    <h6 class="fw-bold mb-3">Overall Goal Progress</h6>

                    <h3 class="text-success"
                        th:text="${goalPercentage} + '%'">0%</h3>

                    <div class="progress mt-3" style="height:10px;">
                        <div class="progress-bar bg-success"
                             th:style="'width:' + ${goalPercentage} + '%'">
                        </div>
                    </div>

                    <small class="text-muted d-block mt-2">
                        Based on all active goals
                    </small>
                </div>
            </div>

            <div class="col-lg-4 col-md-12">
                <div class="card shadow-sm p-4 border-0 text-center">
                    <h6 class="fw-bold mb-3">Performance Rating</h6>

                    <h3 class="text-primary"
                        th:text="${avgRating != null ? #numbers.formatDecimal(avgRating,1,1) : 0} + ' / 5'">
                        0 / 5
                    </h3>

                    <div class="progress mt-3" style="height:10px;">
                        <div class="progress-bar bg-primary"
                             th:style="'width:' + (${avgRating != null ? avgRating * 20 : 0}) + '%'">
                        </div>
                    </div>
                </div>
            </div>

        </div>

        <!-- GOALS -->
        <div class="row g-4 mt-4">
            <div class="col-12">
                <div class="card shadow-sm p-4 border-0">
                    <h6 class="fw-bold mb-3">My Goals</h6>

                    <div th:if="${goals != null and !#lists.isEmpty(goals)}">
                        <div th:each="goal : ${goals}" class="mb-3">

                            <div class="d-flex justify-content-between">
                                <span th:text="${goal.goalDescription}"></span>
                                <span th:text="${goal.progress} + '%'"></span>
                            </div>

                            <div class="progress mt-1" style="height:6px;">
                                <div class="progress-bar bg-info"
                                     th:style="'width:' + ${goal.progress} + '%'">
                                </div>
                            </div>

                        </div>
                    </div>

                    <div th:if="${goals == null or #lists.isEmpty(goals)}"
                         class="text-muted small">
                        No goals assigned yet.
                    </div>

                </div>
            </div>
        </div>

		    </div>
		</div>

		<div th:replace="~{fragments/footer :: footer}"></div>

		<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
		</body>
		</html>
