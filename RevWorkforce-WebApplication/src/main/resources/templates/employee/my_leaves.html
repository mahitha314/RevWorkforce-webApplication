<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
	<th:block th:replace="~{fragments/header :: header('Leave Management')}"></th:block>

	<style>
		body {
			margin: 0;
			overflow-x: hidden;
		}

		.layout {
			display: flex;
		}

		.main-content {
			margin-top: 60px;
			margin-left: 250px;
			padding: 30px;
			width: 100%;
			transition: all 0.3s ease;
		}

		@media (max-width: 768px) {
			.main-content {
				margin-left: 0;
				padding: 20px;
			}
		}

		.table-responsive {
			overflow-x: auto;
		}
	</style>
</head>

<body>

	<div th:replace="~{fragments/header :: topbar('Leave Management')}"></div>

	<div class="layout">

		<div th:replace="~{fragments/employee-sidebar :: sidebar}"></div>

		<div class="main-content">

			<div class="container-fluid">

				<h4 class="mb-4">Leave Management</h4>

				<ul class="nav nav-pills mb-4 flex-wrap gap-2">

					<li class="nav-item">
						<button class="nav-link active px-4" data-bs-toggle="pill" data-bs-target="#apply"
							type="button">
							Apply Leave
						</button>
					</li>

					<li class="nav-item">
						<button class="nav-link px-4" data-bs-toggle="pill" data-bs-target="#balance" type="button">
							Leave Balance
						</button>
					</li>

					<li class="nav-item">
						<button class="nav-link px-4" data-bs-toggle="pill" data-bs-target="#status" type="button">
							Leave Status
						</button>
					</li>

					<li class="nav-item">
						<button class="nav-link px-4" data-bs-toggle="pill" data-bs-target="#history" type="button">
							Leave History
						</button>
					</li>

				</ul>

				<div class="tab-content">
					<div class="tab-pane fade show active" id="apply">

						<div class="card shadow-sm">
							<div class="card-body">

								<div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show">
									<span th:text="${successMessage}"></span>
									<button type="button" class="btn-close" data-bs-dismiss="alert"></button>
								</div>

								<div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show">
									<span th:text="${errorMessage}"></span>
								</div>

								<form th:action="@{/employee/apply-leave}" method="post">

									<div class="mb-3">
										<label class="form-label">Leave Type</label>
										<select name="leaveTypeId" class="form-select" required>
											<option th:each="type : ${leaveTypes}" th:value="${type.id}"
												th:text="${type.typeName}">
											</option>
										</select>
									</div>

									<div class="row">

										<div class="col-md-6 mb-3">
											<label class="form-label">Start Date</label>
											<input type="date" name="startDate" class="form-control" required>
										</div>

										<div class="col-md-6 mb-3">
											<label class="form-label">End Date</label>
											<input type="date" name="endDate" class="form-control" required>
										</div>

									</div>

									<div class="mb-3">
										<label class="form-label">Reason</label>
										<textarea name="reason" class="form-control" required></textarea>
									</div>

									<button class="btn btn-primary">Apply Leave</button>

								</form>

							</div>
						</div>

					</div>

					<div class="tab-pane fade" id="balance">

						<div class="card shadow-sm">
							<div class="card-body">

								<div class="table-responsive">
									<table class="table table-bordered text-center align-middle">

										<thead class="table-dark">
											<tr>
												<th>Leave Type</th>
												<th>Total</th>
												<th>Used</th>
												<th>Remaining</th>
											</tr>
										</thead>

										<tbody>

											<tr th:each="balance : ${leaveBalances}">
												<td th:text="${balance.leaveType.typeName}"></td>
												<td th:text="${balance.totalLeaves}"></td>
												<td th:text="${balance.usedLeaves}"></td>
												<td th:text="${balance.remainingLeaves}"></td>
											</tr>

											<tr th:if="${#lists.isEmpty(leaveBalances)}">
												<td colspan="4" class="text-muted">
													No Leave Balance Available
												</td>
											</tr>

										</tbody>

									</table>
								</div>

							</div>
						</div>

					</div>

					<div class="tab-pane fade" id="status">

						<div class="card shadow-sm">
							<div class="card-body">

								<div class="table-responsive">

									<table class="table table-bordered text-center align-middle">

										<thead class="table-dark">
											<tr>
												<th>Leave Type</th>
												<th>Start</th>
												<th>End</th>
												<th>Status</th>
												<th>Action</th>
											</tr>
										</thead>

										<tbody>

											<tr th:each="leave : ${leaves}">

												<td th:text="${leave.leaveType.typeName}"></td>
												<td th:text="${leave.startDate}"></td>
												<td th:text="${leave.endDate}"></td>
												<td>

													<span th:if="${leave.leaveApproval == null}"
														class="badge bg-warning text-dark">
														Pending
													</span>

													<span
														th:if="${leave.leaveApproval != null and leave.leaveApproval.status == 'APPROVED'}"
														class="badge bg-success">
														Approved
													</span>

													<span
														th:if="${leave.leaveApproval != null and leave.leaveApproval.status == 'REJECTED'}"
														class="badge bg-danger">
														Rejected
													</span>

													<span
														th:if="${leave.leaveApproval != null and leave.leaveApproval.status == 'CANCELLED'}"
														class="badge bg-secondary">
														Cancelled
													</span>

												</td>

												<td>

													<form th:if="${leave.leaveApproval == null}"
														th:action="@{'/employee/cancel/' + ${leave.id}}" method="post">

														<button type="submit" class="btn btn-sm btn-outline-danger"
															onclick="return confirm('Are you sure you want to cancel this leave?')">
															Cancel
														</button>

													</form>

													<span th:if="${leave.leaveApproval != null}">-</span>

												</td>

											</tr>

											<tr th:if="${#lists.isEmpty(leaves)}">
												<td colspan="5" class="text-muted">
													No Leave Requests Found
												</td>
											</tr>

										</tbody>

									</table>

								</div>

							</div>
						</div>

					</div>


					<!-- HISTORY -->
					<div class="tab-pane fade" id="history">

						<div class="card shadow-sm">
							<div class="card-body">

								<table class="table table-bordered text-center align-middle">

									<thead class="table-dark">
										<tr>
											<th>Leave Type</th>
											<th>Start</th>
											<th>End</th>
											<th>Reason</th>
										</tr>
									</thead>

									<tbody>

										<tr th:each="leave : ${leaves}">
											<td th:text="${leave.leaveType.typeName}"></td>
											<td th:text="${leave.startDate}"></td>
											<td th:text="${leave.endDate}"></td>
											<td th:text="${leave.reason}"></td>
										</tr>

									</tbody>

								</table>

							</div>
						</div>

					</div>

				</div>

			</div>

		</div>

	</div>

	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
