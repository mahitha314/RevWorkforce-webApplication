<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Apply Leave</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
          rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css"
          rel="stylesheet">

    <link rel="stylesheet" th:href="@{/css/employee_dashboard.css}">
</head>

<body>

<div class="d-flex">

    <!-- ================= SIDEBAR ================= -->
    <div class="sidebar p-3">
        <h4 class="text-white mb-4">RevWorkForce</h4>

        <a th:href="@{/employee/dashboard}">
            <i class="bi bi-speedometer2"></i> Dashboard
        </a>

        <a th:href="@{/employee/profile}">
            <i class="bi bi-person"></i> My Profile
        </a>

        <a th:href="@{/employee/apply-leave}" class="active">
            <i class="bi bi-pencil-square"></i> Apply Leave
        </a>

        <a th:href="@{/employee/leave-balance}">
            <i class="bi bi-calendar-check"></i> Leave Balance
        </a>

        <a th:href="@{/employee/leave-history}">
            <i class="bi bi-clock-history"></i> Leave History
        </a>

        <a th:href="@{/employee/leave-status}">
            <i class="bi bi-info-circle"></i> Leave Status
        </a>

        <a th:href="@{/logout}">
            <i class="bi bi-box-arrow-right"></i> Logout
        </a>
    </div>

    <!-- ================= MAIN CONTENT ================= -->
    <div class="content flex-grow-1">

        <!-- Topbar -->
        <div class="topbar d-flex justify-content-between align-items-center mb-4">
            <h5>Employee Portal</h5>
            <span>
                Welcome,
                <strong th:text="${employee.firstName}"></strong>
            </span>
        </div>

        <!-- Apply Leave Card -->
        <div class="card shadow-sm p-4">

            <h3 class="mb-3">Apply Leave</h3>
            <p class="text-muted">Submit your leave request below</p>

            <!-- IMPORTANT FORM -->
            <form th:action="@{/employee/apply-leave}" method="post">

                <!-- Leave Type -->
                <div class="mb-3">
                    <label class="form-label">Leave Type</label>
                    <select name="leaveTypeId" class="form-select" required>
                        <option value="">-- Select Leave Type --</option>
                        <option th:each="type : ${leaveTypes}"
                                th:value="${type.id}"
                                th:text="${type.typeName}">
                        </option>
                    </select>
                </div>

                <!-- Start Date -->
                <div class="mb-3">
                    <label class="form-label">Start Date</label>
                    <input type="date" name="startDate"
                           class="form-control" required>
                </div>

                <!-- End Date -->
                <div class="mb-3">
                    <label class="form-label">End Date</label>
                    <input type="date" name="endDate"
                           class="form-control" required>
                </div>

                <!-- Reason -->
                <div class="mb-3">
                    <label class="form-label">Reason</label>
                    <textarea name="reason"
                              class="form-control"
                              rows="3"
                              required></textarea>
                </div>

                <button type="submit" class="btn btn-primary">
                    Apply Leave
                </button>

            </form>

        </div>

    </div>
</div>

</body>
</html>
