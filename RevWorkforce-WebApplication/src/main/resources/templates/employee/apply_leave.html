<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/header :: header('Apply Leave')"></head>

<body>

<div th:replace="fragments/header :: topbar"></div>

<div class="wrapper">

    <div th:replace="fragments/employee-sidebar :: sidebar"></div>

    <div class="main-content">

        <h3 class="fw-bold mb-4">Apply Leave</h3>
         
        <div class="card shadow-sm p-4 border-0">

            <form th:action="@{/employee/apply-leave}" method="post">

                <div class="mb-3">
                    <label class="form-label">Leave Type</label>
                    <select name="leaveTypeId" class="form-select">
                        <option th:each="type : ${leaveTypes}"
                                th:value="${type.id}"
                                th:text="${type.typeName}">
                        </option>
                    </select>
                </div>

                <div class="mb-3">
                    <label class="form-label">Start Date</label>
                    <input type="date" name="startDate" class="form-control">
                </div>

                <div class="mb-3">
                    <label class="form-label">End Date</label>
                    <input type="date" name="endDate" class="form-control">
                </div>

                <div class="mb-3">
                    <label class="form-label">Reason</label>
                    <textarea name="reason" class="form-control" rows="3"></textarea>
                </div>

                <button type="submit" class="btn btn-primary px-4">
                    Submit
                </button>

            </form>

        </div>

    </div>
</div>

<div th:replace="fragments/footer :: footer"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
