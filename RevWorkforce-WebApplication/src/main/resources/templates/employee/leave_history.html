<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="fragments/header :: header('Leave History')"></head>

<body>

	<div th:replace="fragments/header :: topbar"></div>

	<div class="wrapper">
		<div th:replace="fragments/employee-sidebar :: sidebar"></div>

		<div class="main-content">

			<h3 class="fw-bold mb-4">Leave History</h3>
			<div th:replace="fragments/leave-tabs :: leaveTabs('history')"></div>
			<div class="card shadow-sm p-4">

				<table class="table table-bordered table-hover">
					<thead class="table-dark">
						<tr>
							<th>Leave Type</th>
							<th>From</th>
							<th>To</th>
							<th>Status</th>
						</tr>
					</thead>
					<tbody>

						<tr th:each="leave : ${history}" th:if="${!#strings.equalsIgnoreCase(leave.status,'PENDING')}">

							<td th:text="${leave.leaveType.typeName}"></td>
							<td th:text="${leave.startDate}"></td>
							<td th:text="${leave.endDate}"></td>
							<td th:text="${leave.status}"></td>

						</tr>

						<tr th:if="${#lists.isEmpty(history)}">
							<td colspan="4" class="text-center text-muted">
								No Leave History Available
							</td>
						</tr>

					</tbody>
				</table>

			</div>

		</div>
	</div>

	<div th:replace="fragments/footer :: footer"></div>
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
