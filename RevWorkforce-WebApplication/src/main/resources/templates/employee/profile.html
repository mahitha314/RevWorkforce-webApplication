<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>My Profile</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { margin:0; font-family:'Segoe UI'; background:#f4f6f9; }

        .sidebar {
            position: fixed;
            width: 240px;
            height: 100vh;
            background: black;
            padding-top: 20px;
            color: white;
        }

        .sidebar a {
            display: block;
            padding: 12px 20px;
            color: white;
            text-decoration: none;
        }

        .sidebar a:hover { background: rgba(255,255,255,0.2); }

        .content {
            margin-left: 240px;
            padding: 40px;
        }

        .topbar {
            background: black;
            color: white;
            padding: 15px 30px;
            margin-left: 240px;
        }
    </style>
</head>

<body>

<div class="sidebar">
    <h4 class="text-center">Employee</h4>
    <a href="/employee/dashboard">Dashboard</a>
    <a href="/employee/profile">My Profile</a>
    <a href="/employee/performance">Performance</a>
    <a href="/employee/goals">Goals</a>
    <a href="/logout">Logout</a>
</div>

<div class="topbar">
    Welcome <span th:text="${employee.firstName}"></span>
</div>

<div class="content">
    <h3>My Profile</h3>
    <table class="table table-bordered w-50">
        <tr>
            <th>First Name</th>
            <td th:text="${employee.firstName}"></td>
        </tr>
        <tr>
            <th>Email</th>
            <td th:text="${employee.email}"></td>
        </tr>
        <tr>
            <th>Role</th>
            <td th:text="${employee.role}"></td>
        </tr>
    </table>
</div>

</body>
</html>
