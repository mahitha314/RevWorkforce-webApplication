<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <th:block th:replace="~{fragments/header :: header('My Profile')}"></th:block>
</head>

<body>


<div th:replace="~{fragments/employee-sidebar :: sidebar}"></div>


<div th:replace="~{fragments/header :: topbar('My Profile')}"></div>


<div class="content p-4">

    <!-- Page Header -->
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h3 class="fw-bold">👤 My Profile</h3>

        <a th:href="@{/employee/profile_edit}"
           class="btn btn-primary">
            Update Profile
        </a>
    </div>

    <!-- Success Message -->
    <div th:if="${successMessage}"
         class="alert alert-success"
         th:text="${successMessage}">
    </div>

   
    <div class="card shadow-sm border-0 p-4">

        <!-- Null Safety Check -->
        <div th:if="${employee != null}" class="row g-3">

            <div class="col-md-6">
                <label class="fw-bold">First Name</label>
                <p th:text="${employee.firstName}"></p>
            </div>

            <div class="col-md-6">
                <label class="fw-bold">Last Name</label>
                <p th:text="${employee.lastName}"></p>
            </div>

            <div class="col-md-6">
                <label class="fw-bold">Email</label>
                <p th:text="${employee.email}"></p>
            </div>

            <div class="col-md-6">
                <label class="fw-bold">Phone Number</label>
                <p th:text="${employee.phoneNumber}"></p>
            </div>

            <div class="col-md-6">
                <label class="fw-bold">Address</label>
                <p th:text="${employee.address}"></p>
            </div>

            <div class="col-md-6">
                <label class="fw-bold">Emergency Contact</label>
                <p th:text="${employee.emergencyContact}"></p>
            </div>

            <div class="col-md-6">
                <label class="fw-bold">Department</label>
                <p th:text="${employee.department != null ? employee.department.name : 'Not Assigned'}"></p>
            </div>

            <div class="col-md-6">
                <label class="fw-bold">Designation</label>
                <p th:text="${employee.designation != null ? employee.designation.title : 'Not Assigned'}"></p>
            </div>

        </div>

        <!-- If Employee Not Loaded -->
        <div th:if="${employee == null}" class="text-center text-muted py-4">
            Employee details not available.
        </div>

    </div>

</div>


<div th:replace="~{fragments/footer :: footer}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
