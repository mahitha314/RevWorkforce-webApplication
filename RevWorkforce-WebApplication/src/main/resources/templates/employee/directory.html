<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <!-- ✅ HEADER TAKES ONLY 1 PARAMETER -->
    <th:block th:replace="~{fragments/header :: header('Employee Directory')}"></th:block>
</head>

<body>

    <!-- Sidebar -->
    <div th:replace="~{fragments/employee-sidebar :: sidebar}"></div>

    <!-- ✅ Topbar takes ONLY pageTitle -->
    <div th:replace="~{fragments/header :: topbar('Employee Directory')}"></div>

    <div class="content">

        <h3 class="fw-bold mb-4">Employee Directory</h3>

        <!-- Search Card -->
        <div class="card shadow-sm border-0 p-3 mb-4">
            <form method="get" th:action="@{/employee/directory}">
                <div class="row g-3 align-items-center">
                    <div class="col-md-9">
                        <input type="text"
                               name="keyword"
                               class="form-control"
                               placeholder="Search by name or email"
                               th:value="${keyword}">
                    </div>
                    <div class="col-md-3">
                        <button type="submit" class="btn btn-primary w-100">
                            <i class="bi bi-search"></i> Search
                        </button>
                    </div>
                </div>
            </form>
        </div>

        <!-- Table Card -->
        <div class="card shadow-sm border-0 p-4">
            <div class="table-responsive">
                <table class="table table-hover table-bordered align-middle text-center">

                    <thead class="table-dark">
                        <tr>
                            <th>Name</th>
                            <th>Email</th>
                            <th>Department</th>
                            <th>Designation</th>
                            <th>Status</th>
                        </tr>
                    </thead>

                    <tbody>

                        <tr th:each="emp : ${employees}">
                            <td th:text="${emp.firstName + ' ' + emp.lastName}"></td>
                            <td th:text="${emp.email}"></td>
                            <td th:text="${emp.department != null ? emp.department.name : '-'}"></td>
                            <td th:text="${emp.designation != null ? emp.designation.title : '-'}"></td>
                            <td>
                                <span class="badge"
                                      th:classappend="${emp.status == 'ACTIVE'} ? ' bg-success' : ' bg-secondary'"
                                      th:text="${emp.status}">
                                </span>
                            </td>
                        </tr>

                        <tr th:if="${#lists.isEmpty(employees)}">
                            <td colspan="5" class="text-muted">
                                No employees found.
                            </td>
                        </tr>

                    </tbody>

                </table>
            </div>
        </div>

    </div>

    <!-- Footer -->
    <div th:replace="~{fragments/footer :: footer}"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
