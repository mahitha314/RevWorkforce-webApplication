<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/header :: header('Employee Directory')"></head>

<body>

<div th:replace="fragments/header :: topbar"></div>

<div class="wrapper">

    <div th:replace="fragments/sidebar :: sidebar"></div>

    <div class="main-content">

        <h3 class="fw-bold mb-4">Employee Directory</h3>

        <!-- 🔍 SEARCH -->
        <div class="card shadow-sm border-0 p-3 mb-4">
            <form method="get" th:action="@{/employee/directory}">
                <div class="row">

                    <div class="col-md-10">
                        <input type="text"
                               name="keyword"
                               class="form-control"
                               placeholder="Search by name or email"
                               th:value="${keyword}">
                    </div>

                    <div class="col-md-2">
                        <button class="btn btn-primary w-100">
                            <i class="bi bi-search"></i> Search
                        </button>
                    </div>

                </div>
            </form>
        </div>

        <!-- 👥 TABLE -->
        <div class="card shadow-sm border-0 p-4">

            <table class="table table-hover table-bordered">

                <thead class="table-dark">
                <tr>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Department</th>
                    <th>Designation</th>
                    <th>Status</th>
                </tr>
                </thead>

                <tbody>

                <tr th:each="emp : ${employees}">
                    <td th:text="${emp.firstName + ' ' + emp.lastName}"></td>
                    <td th:text="${emp.email}"></td>
                    <td th:text="${emp.department != null ? emp.department.name : '-'}"></td>
                    <td th:text="${emp.designation != null ? emp.designation.title : '-'}"></td>
                    <td>
                        <span class="badge bg-success"
                              th:text="${emp.status}"></span>
                    </td>
                </tr>

                <tr th:if="${#lists.isEmpty(employees)}">
                    <td colspan="5"
                        class="text-center text-muted">
                        No employees found.
                    </td>
                </tr>

                </tbody>

            </table>

        </div>

    </div>
</div>

<div th:replace="fragments/footer :: footer"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
