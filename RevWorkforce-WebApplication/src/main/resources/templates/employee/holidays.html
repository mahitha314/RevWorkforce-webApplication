<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="fragments/header :: header('Holiday Calendar')"></head>

<body>

<div th:replace="fragments/sidebar :: sidebar"></div>
<div th:replace="fragments/header :: topbar"></div>

<div class="content">

    <div class="mb-4">
        <h3 class="fw-bold">Holiday Calendar</h3>
        <p class="text-muted">Upcoming Company Holidays</p>
    </div>

    <div class="card shadow-sm border-0">

        <div class="card-header bg-success text-white fw-bold">
            Upcoming Holidays
        </div>

        <div class="card-body">

            <div class="table-responsive">

                <table class="table table-bordered table-hover text-center">

                    <thead class="table-light">
                    <tr>
                        <th>Date</th>
                        <th>Day</th>
                        <th>Holiday</th>
                        <th>Description</th>
                    </tr>
                    </thead>

                    <tbody>

                    <tr th:each="holiday : ${holidays}">
                        <td th:text="${holiday.holidayDate}"></td>
                        <td th:text="${holiday.holidayDate.dayOfWeek}"></td>
                        <td th:text="${holiday.holidayName}"></td>
                        <td th:text="${holiday.description}"></td>
                    </tr>

                    <tr th:if="${#lists.isEmpty(holidays)}">
                        <td colspan="4" class="text-muted">
                            No upcoming holidays available.
                        </td>
                    </tr>

                    </tbody>

                </table>

            </div>

        </div>

    </div>

</div>

<div th:replace="fragments/footer :: footer"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
