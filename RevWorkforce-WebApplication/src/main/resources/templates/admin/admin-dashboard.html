<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/header :: header('Admin Dashboard')}"></head>

<body>

<!-- SIDEBAR -->
<div th:replace="~{fragments/sidebar :: sidebar('dashboard')}"></div>

<!-- TOPBAR -->
<div th:replace="~{fragments/header :: topbar('Admin Dashboard')}"></div>

<!-- CONTENT -->
<div class="content">

<div class="container-fluid mt-4">

<div class="row g-4 mb-4">

<div class="col-md-4">
<div class="card dashboard-card shadow-sm">
<div>
<h6>Total Employees</h6>
<h3 th:text="${totalEmployees}">0</h3>
</div>
<i class="bi bi-people-fill icon"></i>
</div>
</div>

<div class="col-md-4">
<div class="card dashboard-card shadow-sm">
<div>
<h6>Total Managers</h6>
<h3 th:text="${totalManagers}">0</h3>
</div>
<i class="bi bi-person-badge-fill icon"></i>
</div>
</div>

<div class="col-md-4">
<div class="card dashboard-card shadow-sm">
<div>
<h6>Total Departments</h6>
<h3 th:text="${totalDepartments}">0</h3>
</div>
<i class="bi bi-building icon"></i>
</div>
</div>

<div class="col-md-4">
<div class="card dashboard-card shadow-sm">
<div>
<h6>Total Designations</h6>
<h3 th:text="${totalDesignations}">0</h3>
</div>
<i class="bi bi-award-fill icon"></i>
</div>
</div>

<div class="col-md-4">
<div class="card dashboard-card shadow-sm">
<div>
<h6>Total Leaves</h6>
<h3 th:text="${totalLeaves}">0</h3>
</div>
<i class="bi bi-calendar-check-fill icon"></i>
</div>
</div>

</div>


<div class="card shadow-sm p-4">

<div class="d-flex justify-content-between align-items-center mb-3">

<h5>Employee Records</h5>

<div class="d-flex gap-2">

<button class="btn btn-success" onclick="loadActiveEmployees()">
Active Employees
</button>

<button class="btn btn-danger" onclick="loadInactiveEmployees()">
Inactive Employees
</button>

</div>

</div>

<div id="result"></div>

</div>

</div>
</div>


<!-- Confirm Modal -->
<div class="modal fade" id="confirmModal" tabindex="-1">

<div class="modal-dialog">

<div class="modal-content">

<div class="modal-header">
<h5 class="modal-title">Confirm Status Change</h5>
<button type="button" class="btn-close" data-bs-dismiss="modal"></button>
</div>

<div class="modal-body">
Are you sure you want to change this employee status?
</div>

<div class="modal-footer">

<button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
Cancel
</button>

<button type="button" class="btn btn-primary" id="confirmBtn">
Yes
</button>

</div>

</div>

</div>

</div>


<!-- Notification -->
<div id="customNotification" class="custom-notification"></div>


<div th:replace="~{fragments/footer :: footer}"></div>


<style>

body{
background:#f4f6f9;
}

.dashboard-card{
border-radius:12px;
padding:20px;
display:flex;
justify-content:space-between;
align-items:center;
}

.dashboard-card .icon{
font-size:30px;
color:#0d6efd;
}

.status-active{
color:green;
font-weight:600;
}

.status-inactive{
color:red;
font-weight:600;
}

.custom-notification{
position:fixed;
top:-100px;
left:50%;
transform:translateX(-50%);
padding:15px 25px;
border-radius:8px;
color:white;
font-weight:500;
z-index:9999;
transition:top 0.5s ease-in-out;
box-shadow:0 5px 15px rgba(0,0,0,0.2);
}

.custom-notification.show{
top:20px;
}

.notification-success{
background-color:#28a745;
}

.notification-danger{
background-color:#dc3545;
}

.notification-warning{
background-color:#ffc107;
color:black;
}

.notification-info{
background-color:#17a2b8;
}

</style>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>


<script>

let selectedEmployeeId=null;
let selectedAction=null;
let currentView="ACTIVE";

const modal=new bootstrap.Modal(document.getElementById('confirmModal'));

document.addEventListener("DOMContentLoaded",function(){
loadActiveEmployees();
});

function loadActiveEmployees(){
currentView="ACTIVE";
fetchEmployees();
}

function loadInactiveEmployees(){
currentView="INACTIVE";
fetchEmployees();
}

function fetchEmployees(){

fetch("/admin/employees")

.then(res=>{
if(!res.ok) throw new Error();
return res.json();
})

.then(api=>{

const filtered=(api.data||[]).filter(emp=>emp.status===currentView);

renderEmployeeTable(filtered);

})

.catch(()=>showNotification("Failed to load employees","danger"));

}

function renderEmployeeTable(data){

if(!data||data.length===0){

document.getElementById("result").innerHTML=
"<p class='text-muted'>No employees found.</p>";

return;

}

let table=`

<div class="table-responsive">

<table class="table table-striped table-bordered">

<thead class="table-dark">

<tr>
<th>ID</th>
<th>Name</th>
<th>Department</th>
<th>Designation</th>
<th>Role</th>
<th>Status</th>
<th>Action</th>
</tr>

</thead>

<tbody>

`;

data.forEach(emp=>{

let actionButton=emp.status==="ACTIVE"

? `<button class="btn btn-sm btn-danger"
onclick="confirmAction('${emp.employeeId}','deactivate')">
Deactivate
</button>`

: `<button class="btn btn-sm btn-success"
onclick="confirmAction('${emp.employeeId}','reactivate')">
Reactivate
</button>`;

table+=`

<tr>

<td>${emp.employeeId}</td>

<td>${emp.firstName} ${emp.lastName}</td>

<td>${emp.department?.name||'-'}</td>

<td>${emp.designation?.title||'-'}</td>

<td>${emp.role||'-'}</td>

<td class="${emp.status==='ACTIVE'?'status-active':'status-inactive'}">

${emp.status}

</td>

<td>${actionButton}</td>

</tr>

`;

});

table+=`</tbody></table></div>`;

document.getElementById("result").innerHTML=table;

}

function confirmAction(employeeId,action){

selectedEmployeeId=employeeId;
selectedAction=action;

modal.show();

}

document.getElementById("confirmBtn").addEventListener("click",function(){

if(!selectedEmployeeId||!selectedAction) return;

modal.hide();

let url=selectedAction==="deactivate"

? `/admin/employees/${selectedEmployeeId}/deactivate`

: `/admin/employees/${selectedEmployeeId}/reactivate`;

fetch(url,{method:"PUT"})

.then(res=>{
if(!res.ok) throw new Error();
return res.json();
})

.then(data=>{

showNotification(

data.message||"Status Updated Successfully",

selectedAction==="deactivate"?"warning":"success"

);

fetchEmployees();

selectedEmployeeId=null;
selectedAction=null;

})

.catch(()=>showNotification("Action failed","danger"));

});

function showNotification(message,type){

const notification=document.getElementById("customNotification");

notification.className=`custom-notification notification-${type}`;

notification.innerText=message;

notification.classList.add("show");

setTimeout(()=>{
notification.classList.remove("show");
},3000);

}

</script>

</body>
</html>
