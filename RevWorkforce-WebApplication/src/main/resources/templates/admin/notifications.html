<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Notifications | RevWorkForce</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

    <!-- Include Header Fragment (CSS/Topbar Part) -->
    <th:block th:replace="~{fragments/header :: header('notifications')}"></th:block>

    <style>
        body {
            background-color: #f5f6fa;
        }

        /* Main content layout */
        .content-wrapper {
            margin-left: 250px;
            padding: 100px 20px 30px 20px;
            min-height: 100vh;
            transition: 0.3s;
        }

        /* Responsive */
        @media (max-width: 991px) {
            .content-wrapper {
                margin-left: 0;
                padding-top: 110px;
            }
        }

        .notify-dot {
            position: absolute;
            top: 2px;
            right: 2px;
            width: 8px;
            height: 8px;
            background-color: red;
            border-radius: 50%;
        }

        .notification-card:hover {
            background-color: #f8f9fa;
            transition: 0.3s;
        }
    </style>
</head>

<body>

<!-- TOPBAR -->
<div th:replace="fragments/header :: topbar('Notifications')"></div>

<!-- SIDEBAR -->
<div th:replace="fragments/sidebar :: sidebar(${view})"></div>


<!-- ================= MAIN CONTENT ================= -->
<div class="content-wrapper">

    <div class="container-fluid">

        <div class="row justify-content-center">

            <div class="col-12 col-lg-10 col-xl-9">

                <div class="card shadow border-0 rounded-4">

                    <div class="card-body p-4 p-md-5">

                        <!-- Title Section -->
                        <div class="d-flex flex-column flex-md-row 
                                    justify-content-between 
                                    align-items-md-center mb-4 gap-3">

                            <h3 class="fw-bold mb-0">
                                <i class="bi bi-bell text-primary me-2"></i>
                                My Notifications
                            </h3>

                            <div class="d-flex align-items-center gap-3">
                                <span class="fw-semibold">Unread:</span>
                                <span id="unreadCount"
                                      class="badge bg-danger fs-6 px-3 py-2">
                                    0
                                </span>

                                <button class="btn btn-primary btn-sm px-3"
                                        onclick="markAll()">
                                    Mark All Read
                                </button>
                            </div>

                        </div>

                        <!-- Notification List -->
                        <div id="notificationContainer" class="mt-3"></div>

                    </div>

                </div>

            </div>

        </div>

    </div>

</div>



<!-- ================= JAVASCRIPT ================= -->
<script>

document.addEventListener("DOMContentLoaded", function() {
    loadNotifications();
    updateBellIndicator();
});

async function loadNotifications() {
    const response = await fetch("/notifications/my", { credentials: "include" });
    const result = await response.json();

    const container = document.getElementById("notificationContainer");
    container.innerHTML = "";

    let unread = 0;

    if (!result.data || result.data.length === 0) {
        container.innerHTML = `
            <div class="text-center text-muted py-5">
                <i class="bi bi-bell fs-1"></i>
                <p class="mt-3">No notifications available</p>
            </div>`;
        document.getElementById("unreadCount").innerText = 0;
        return;
    }

    result.data.forEach(n => {

        if (!n.isRead) unread++;

        const card = document.createElement("div");
        card.className = "card mb-3 shadow-sm notification-card " +
                         (!n.isRead ? "border-start border-4 border-primary" : "");

        card.innerHTML = `
            <div class="card-body">

                <div class="d-flex justify-content-between">
                    <h6 class="fw-bold mb-1">
                        <i class="bi ${getIcon(n.type)}"></i> ${n.title}
                    </h6>
                    ${!n.isRead ? '<span class="badge bg-primary">New</span>' : ''}
                </div>

                <p class="mb-1">${n.message}</p>

                <small class="text-muted">${formatDate(n.createdAt)}</small>

                <div class="mt-3">
                    ${!n.isRead ?
                        `<button class="btn btn-success btn-sm me-2"
                            onclick="markRead(${n.notificationId})">
                            Mark Read
                        </button>` : ""}
                    <button class="btn btn-danger btn-sm"
                        onclick="deleteNotification(${n.notificationId})">
                        Delete
                    </button>
                </div>

            </div>
        `;

        container.appendChild(card);
    });

    document.getElementById("unreadCount").innerText = unread;
}

async function markRead(id) {
    await fetch(`/notifications/${id}/read`, {
        method: "PUT",
        credentials: "include"
    });
    loadNotifications();
    updateBellIndicator();
}

async function deleteNotification(id) {
    await fetch(`/notifications/${id}`, {
        method: "DELETE",
        credentials: "include"
    });
    loadNotifications();
    updateBellIndicator();
}

async function markAll() {
    await fetch("/notifications/read-all", {
        method: "PUT",
        credentials: "include"
    });
    loadNotifications();
    updateBellIndicator();
}

async function updateBellIndicator() {
    const response = await fetch("/notifications/my/unread-count", { credentials: "include" });
    const result = await response.json();

    const dot = document.getElementById("notifyDot");

    if (dot) {
        dot.style.display = result.data > 0 ? "block" : "none";
    }
}

function formatDate(dateString) {
    const date = new Date(dateString);
    return date.toLocaleString();
}

function getIcon(type) {
    switch(type) {
        case "LEAVE": return "bi-calendar-check";
        case "ANNOUNCEMENT": return "bi-megaphone";
        case "HOLIDAY": return "bi-calendar-event";
        default: return "bi-bell";
    }
}

</script>

</body>
</html>
